# Cuts a release from a tag: build the three files, verify them, attach them.
#
# The reason this exists is that packaging was a local ritual — `./package.sh`,
# then remember to run `./verify-dist.sh`, then upload three files by hand — and
# the failure mode of a ritual is skipping the middle step on the one evening you
# are in a hurry. A stale `dist/` looks exactly like a fresh one.
#
# The tag is the input, not the branch: `package.sh` refuses to build unless the
# working tree matches HEAD, so the checkout below IS the release. Nothing here
# rebuilds anything the local run would not.
#
# One precondition cannot be rebuilt here at all: the full-fidelity measurement
# needs the real model and a GPU. It is carried as a committed artifact instead,
# and the step before the upload refuses to publish a tag whose evidence measured
# a different tree — see step 6 of docs/RELEASE-CHECKLIST.md.
name: release

on:
  push:
    tags: ["v*"]
  # Rehearse it without minting a tag. The upload step is skipped, so a dry run
  # cannot publish; everything up to it is the identical path.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Every cheap gate the repo has, as a precondition of publishing rather than as
  # something that merely ran at some point on some commit. Round 5 was tagged from
  # a commit that was red in two of these jobs: this workflow ran `pnpm verify` —
  # which did not even include lint — and had no relationship to the rest of CI.
  # Calling ci.yml keeps one definition of those jobs; `needs:` alone cannot,
  # because it does not reach across workflows.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      # Full history: verify-dist.sh resolves trees and blobs at HEAD with
      # `git rev-parse` and `git archive`, and a shallow clone answers neither.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app

      # The content gates, before the build rather than after: a release that
      # ships a workbook whose claims disagree with the lessons is worse than no
      # release, and `pnpm build` alone would not notice. `verify` now begins with
      # `lint` — it did not, which is how two Biome errors shipped while this step
      # was green, and the name `verify` is only worth trusting if it is complete.
      - run: pnpm verify
        working-directory: app

      - run: ./package.sh

      # The point of the job. package.sh can succeed and still produce something
      # that should not be published — a zip whose members drifted from HEAD, a
      # stamp naming another commit, a shipped verify-e2e.sh that cannot resolve
      # its own commit outside a checkout. All five checks, on the artifact that
      # is about to be uploaded rather than on a local one.
      - run: ./verify-dist.sh

      # A tag says what the release claims to be; the stamp says what it is. If
      # they disagree, somebody tagged one commit and built another.
      - name: The stamp names the tagged commit
        run: |
          stamped=$(python3 -c 'import json;print(json.load(open("dist/BUILD.json"))["commit"])')
          if [ "$stamped" != "$GITHUB_SHA" ]; then
            echo "error: dist/BUILD.json names $stamped, the tag points at $GITHUB_SHA" >&2
            exit 1
          fi
          members=$(python3 -c 'import json;print(len(json.load(open("dist/BUILD.json"))["files"]))')
          version=$(python3 -c 'import json;s=json.load(open("dist/BUILD.json"));print(s["version"],"from",s["version_source"])')
          echo "release $GITHUB_REF_NAME · ${stamped:0:12} · $version · $members verified zip members"

      # The precondition the documentation has always stated and nothing ever
      # checked. Steps 1-4 of the release checklist are the cheap gates, and this
      # workflow runs all of them; step 5 is the full-fidelity measurement — the
      # deployed stack, the real model, RAGAS, the whole red-team dataset — and it
      # cannot run here. A hosted runner is four cores with no GPU, which is why
      # the e2e lane is named "wiring, small model" and says so in its own title.
      #
      # So the artifacts are carried instead of recomputed: the maintainer measures
      # locally and commits the result, and this refuses to publish unless that
      # result describes the source being published, clears the same four merge
      # gates the course teaches, and comes with proof that the deployed stack
      # passed its whole end-to-end suite on the lane being claimed.
      #
      # The logic is a script rather than sixty lines of shell in a YAML string,
      # because a gate nobody can run locally is a gate nobody tests — and this
      # one is checking evidence for a bug class that reached production twice.
      # Both ids are asked of the capstone rather than reimplemented, for the same
      # reason `verify-e2e.sh` has `--print-commit`: a copy of the path list in a
      # workflow file is a copy that will drift. Both are stdlib-only, so there is
      # no `uv sync` here.
      #
      # `--inputs` is what `--commit "$GITHUB_SHA"` used to be, and the change is the
      # difference between a gate and a deadlock. A tag's commit CONTAINS the
      # evidence, so an attestation recorded before that commit existed can never
      # name it; the tree ids behind `release_inputs_id` exclude `release/evidence/`
      # and therefore do not move when the evidence is committed.
      #
      # A tag fails; a dispatch warns. A rehearsal is for proving the packaging
      # path works, and refusing to rehearse without an hour of local measurement
      # would just mean nobody rehearses.
      - name: The committed evidence measures THIS source
        run: |
          set -euo pipefail
          read -r want inputs < <(cd src/workshops/assistant/after \
            && PYTHONPATH=src python3 -c 'import assistant.provenance as p; print(p.source_id(), p.release_inputs_id())')
          warn=""
          case "$GITHUB_REF" in refs/tags/*) ;; *) warn="--warn-only" ;; esac
          python3 .github/scripts/check-release-evidence.py \
            --source "$want" --inputs "$inputs" $warn

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.ref_name }}
          path: dist/

      # Only a tag publishes. A dispatch run has proved the same things and is
      # allowed to stop here.
      #
      # All three evidence files ship, not just the readable one. The page is a
      # summary and the gate above reads the other two — publishing only the page
      # asks a reader to trust a number whose source and completeness are in files
      # they cannot see.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/course.html
            dist/README.md
            dist/genai-engineer-workbook-src.zip
            dist/BUILD.json
            release/evidence/RELEASE-EVIDENCE.md
            release/evidence/release-report.json
            release/evidence/e2e-attestation.json
          generate_release_notes: true
