# Repo-wide CI: the same checks the local verification scripts run, as separate
# required jobs so a failure names its owner (a lesson, the scaffolds, parity,
# the app, or the deployable image) instead of hiding in one long log.
#
# Every `uses:` here and in the other two workflows is pinned to a commit SHA with
# its version in a trailing comment. `@v5` is a branch-like tag its owner can move,
# so it names whatever that repository points it at on the morning CI happens to
# run — and these jobs hold a token that can publish a release. The comment is what
# makes the pin readable; the SHA is what makes it a pin. To bump one:
#
#   git ls-remote --tags https://github.com/actions/checkout v5
#
# and take the `refs/tags/v5^{}` hash, which is the commit the tag peels to.
name: ci
on:
  push:
  pull_request:
  # Callable, so `release.yml` can depend on these jobs instead of re-listing
  # them. `needs:` cannot reach across workflows, and the alternative — copying
  # the jobs into the release workflow — is two definitions that will disagree.
  # Round 5 was tagged from a commit that was red in two of these jobs, because
  # the release path ran `pnpm verify` and nothing else.
  workflow_call:

jobs:
  lessons-after:
    # every after/ lesson: sync + lint + fast tests + types (offline by design)
    #
    # On a named interpreter, once per version the course claims. `requires-python`
    # is a claim like any other in this repo, and it was the one nothing checked: an
    # unpinned `uv sync` takes the newest interpreter it can find, so every run
    # proved the ceiling by accident and the floor never. 3.11 is the declared floor;
    # 3.14 is the top of `<3.15`; 3.12 is here because one lesson lives only there —
    # the framework bakeoff pins `>=3.12,<3.13` for CrewAI, and the other two lanes
    # skip it by its own declaration rather than pretending to cover it.
    #
    # `fail-fast: false` because "the floor broke" and "the ceiling broke" are
    # different bugs with different fixes, and cancelling one to report the other
    # wastes the run that would have told you which.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: ./src/verify-lessons.sh --python ${{ matrix.python }}

  lessons-before:
    # every before/ scaffold: lint + types green, tests failing BY DESIGN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      # First and cheap: the lane below decides "red by design" with this file, and
      # a judge nobody has watched get it wrong is a judge that always says yes.
      - run: python3 src/before-contract.py --selftest
      - run: ./src/verify-lessons.sh --before

  parity:
    # before/after structure, matching tests, make targets, README claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: python3 src/verify-parity.py

  gates:
    # the phase 8.2 merge gates as a LESSON: the policy runs over the committed
    # fixture report, and every seeded regression must block — proof that a gate
    # which cannot fail is decoration. The real numbers are gated by `evidence`.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/phase8-deploy/02-ci/after
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: make eval
      - run: make redteam
      - run: make latency
      - run: make cost
      - run: make prove-gates

  evidence:
    # The gate that would actually catch a regression: build the capstone IMAGE
    # from this commit, run the assistant on trial inside it, and block the merge
    # on the numbers that run produced. A gate over a committed report only ever
    # checks that somebody remembered to edit a file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: docker build -t capstone:ci .
        working-directory: src/workshops/assistant/after
      # Inside the image, so the evidence describes the artifact that ships
      # rather than a virtualenv that only exists on this runner.
      - run: |
          mkdir -p evidence
          docker run --rm -v "$PWD/evidence:/out" capstone:ci \
            python -m assistant.report --out /out/PORTFOLIO.md --json /out/report.json
          cat evidence/report.json
      # Four steps rather than one loop: a quality regression, a safety bypass, a
      # latency blowout and a cost blowout are different incidents, and the log
      # should name which one happened even when several did.
      - name: quality gate
        run: uv run python src/gate.py --quality "$GITHUB_WORKSPACE/evidence/report.json"
        working-directory: src/phase8-deploy/02-ci/after
      - name: safety gate
        if: '!cancelled()'
        run: uv run python src/gate.py --safety "$GITHUB_WORKSPACE/evidence/report.json"
        working-directory: src/phase8-deploy/02-ci/after
      - name: latency gate
        if: '!cancelled()'
        run: uv run python src/gate.py --latency "$GITHUB_WORKSPACE/evidence/report.json"
        working-directory: src/phase8-deploy/02-ci/after
      - name: cost gate
        if: '!cancelled()'
        run: uv run python src/gate.py --cost "$GITHUB_WORKSPACE/evidence/report.json"
        working-directory: src/phase8-deploy/02-ci/after
      # The three vulnerabilities this codebase shipped, seeded back in. Each
      # regression test must pass against the current code and fail against its
      # defect — so the guarantee CI protects is "these cannot come back
      # unnoticed", not "somebody wrote a test named after them once".
      - name: defect lab
        if: '!cancelled()'
        run: make defect-lab
        working-directory: src/workshops/assistant/after
      # The course-wide log, folding in the defect-lab stamp the previous step
      # left behind. Deliberately not a gate: most claims are learner-generated
      # and read unproven on a clean checkout, which is the honest answer rather
      # than a regression. Its own gate lives in the fast tests, where
      # test_evidence.py checks that every command the page prints still names a
      # lesson and a make target that exist.
      - name: evidence log
        if: '!cancelled()'
        run: |
          PYTHONPATH=src uv run python -m assistant.evidence \
            --out "$GITHUB_WORKSPACE/evidence/EVIDENCE.md" \
            --json "$GITHUB_WORKSPACE/evidence/manifest.json"
        working-directory: src/workshops/assistant/after
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: capstone-evidence
          path: evidence/

  app:
    # the workbook: typecheck + data alignment/integrity/density/claims checks +
    # build, then axe and the keyboard journey against the built page.
    #
    # `check-claims` reaches outside app/ on purpose: it compares the canonical
    # tables in app/src/data/reference.ts against the two READMEs and the PRICE
    # dicts in the Python lessons, which is where the copies had already drifted.
    #
    # `check-doc-links` does too, and it reads git rather than the filesystem —
    # the companion zip is `git archive HEAD -- src`, so a document's presence on
    # disk says nothing about whether a student receives it. It needs the checkout
    # `actions/checkout` gives it and refuses to guess without one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm lint
        working-directory: app
      - run: pnpm test
        working-directory: app
      - run: pnpm build
        working-directory: app
      # After the build on purpose: this one mounts dist/course.html, the artifact
      # a student actually opens, not a component rendered in isolation.
      - run: pnpm check-a11y
        working-directory: app
      # jsdom has no layout engine, so `color-contrast` and
      # `scrollable-region-focusable` come back "incomplete" there and the step
      # above cannot fail on them. This one runs the same rules in Chromium,
      # across both viewports and both themes, which is where the round-3 audit
      # found four unreadable phase accents and three unreachable scroll boxes.
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: pnpm check-a11y:browser
        working-directory: app
      # Reading position and mobile folding, in the same Chromium. Both are pure
      # geometry and per-phase state, so jsdom cannot see either: it reports every
      # element at 0x0 and never navigates. This gate is where "tap a section, get
      # that section" and "arrive at a phase folded" are held.
      - run: pnpm check-sections
        working-directory: app

  compose-build:
    # the capstone image must build AND run on every change. Booting the whole
    # stack is not a push-lane job: the scheduled `e2e` workflow runs all of
    # src/verify-e2e.sh against a small model, and the full-fidelity run is a
    # local release gate. Booting the assistant ALONE is, because it costs
    # seconds and it is the check this repo was missing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Build the RELEASE artifact first, not the checkout: `git archive` is what the
      # student ZIP is cut from, so an ignored-but-present build input (the capstone
      # uv.lock) fails here instead of in a student's terminal.
      - run: ./src/verify-release-build.sh
      # A build that succeeds proves the files copied, not that the application
      # runs in the layout the Dockerfile produced. Round 5 shipped an image that
      # built green and crashed on import; this is the gate that would have caught
      # it, and it needs no Qdrant, no Ollama and no model to do so.
      - run: ./src/verify-image-smoke.sh
      - run: docker compose build
        working-directory: src/phase8-deploy/01-compose/after
      # the overlays must stay mergeable even though this job never boots them.
      # The e2e workflow stacks all four; a typo in one is a broken nightly that
      # nobody sees until the morning, so it fails here instead.
      - run: docker compose -f docker-compose.yml -f docker-compose.observability.yml config --quiet
        working-directory: src/phase8-deploy/01-compose/after
      - run: |
          ASSISTANT_JWT_SECRET=only-for-config-validation-32-bytes! \
          docker compose -f docker-compose.yml -f docker-compose.secure.yml \
            -f docker-compose.observability.yml -f docker-compose.ci.yml config --quiet
        working-directory: src/phase8-deploy/01-compose/after
