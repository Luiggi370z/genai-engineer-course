[project]
name = "supervisor-crew-after"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pytest>=8,<9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"

[dependency-groups]
dev = ["pyright>=1.1.380,<2", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
