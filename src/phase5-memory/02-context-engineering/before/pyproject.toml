[project]
name = "context-engineering-before"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "rapidfuzz>=3.9,<4",   # near-duplicate detection, same tool as the Phase 3 golden set
  "pytest>=8,<9",
]

[dependency-groups]
dev = ["pyright>=1.1.380,<2", "ruff>=0.6,<1"]
# The real tokenizer. Opt-in because `get_encoding` downloads the BPE file once,
# and a fast tier that needs the network is not a fast tier.
integration = ["tiktoken>=0.7,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src"]
reportMissingImports = "none"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
markers = ["integration: needs the real tokenizer (make test-integration)"]
