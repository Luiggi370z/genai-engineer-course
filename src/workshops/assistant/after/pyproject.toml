[project]
name = "assistant-after"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "opentelemetry-sdk>=1.30,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  # [crypto] pulls in `cryptography`, which RS256/JWKS verification needs. The
  # OAuth lane is a real deployment path, not a doc — an image that cannot verify
  # an issuer-signed token would make the claim false in the only place it counts.
  "pyjwt[crypto]>=2.8,<3",
  "pytest>=8,<9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"
reportMissingImports = "none"  # integration-only libs (qdrant/ollama/mcp/otlp) aren't installed in the fast tier

[dependency-groups]
dev = ["pyright>=1.1.380,<2", "ruff>=0.6,<1", "httpx>=0.27,<1"]
# The real tier. Installed with `uv sync --group integration`; never by the fast gate.
integration = [
  "qdrant-client>=1.10,<2",
  "ollama>=0.3,<1",
  "mcp>=2.0.0,<3",   # SDK v2 (spec 2026-07-28). v1 code will NOT run on this.
  "opentelemetry-exporter-otlp>=1.30,<2",
]
# `make release-evidence` only. Kept out of `integration` because these are the
# two heaviest trees in the repo and neither belongs in the shipped image: the
# reranker drags an ONNX runtime, and RAGAS wraps LangChain. The release lane
# runs on a host, once, before publishing.
#
# The ragas/langchain-community pair is pinned identically in phase2-retrieval
# and phase3-evals; `check-claims` fails the build if the three drift apart.
release = [
  "fastembed>=0.4,<1",
  "ragas>=0.4,<0.5",
  "openai>=1.60,<3",
  "langchain-community>=0.3.27,<0.4",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
markers = ["integration: needs real services (Qdrant/Ollama/MCP/OTLP) — excluded from the fast tier"]
