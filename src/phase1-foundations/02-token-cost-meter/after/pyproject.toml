[project]
name = "token-cost-meter-after"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40,<3",
  "anthropic>=0.40,<1",
  "tiktoken>=0.7,<1",
  "pytest>=8,<9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]

[dependency-groups]
dev = ["pyright>=1.1.380,<2", "ruff>=0.6,<1"]
