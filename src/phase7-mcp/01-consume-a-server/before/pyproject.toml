[project]
name = "mcp-consume-before"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0.0,<3",   # SDK v2 (spec 2026-07-28). v1 code will NOT run on this.
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[dependency-groups]
dev = ["pyright>=1.1.380,<2", "ruff>=0.6,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src"]
reportMissingImports = "none"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: needs external processes (make test-integration)"]
