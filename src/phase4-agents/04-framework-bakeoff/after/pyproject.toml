[project]
name = "framework-bakeoff-after"
version = "0.1.0"
# CrewAI's dependency tree pins this lesson to 3.12: on 3.13+ it dies inside
# Chroma's Pydantic v1 shim, and the traceback names Chroma rather than the
# interpreter. Pinning here means `uv sync` fetches a 3.12 and the integration
# tier actually runs, instead of skipping and calling that a pass. The rest of
# the course is 3.11 through 3.14.
requires-python = ">=3.12,<3.13"
dependencies = [
  "pytest>=8,<9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"
# The integration-group frameworks aren't installed in the default env.
reportMissingImports = "none"

[dependency-groups]
dev = ["pyright>=1.1.380,<2", "ruff>=0.6,<1"]
# The real frameworks. Heavy dep tree, so opt-in: `make test-integration`.
# LangGraph + Pydantic AI prove their ideas offline; CrewAI needs Ollama.
integration = [
  "langgraph>=0.6,<2",
  # The durability row is only worth printing if it is measured across a
  # process boundary, and MemorySaver cannot cross one.
  "langgraph-checkpoint-sqlite>=2,<4",
  "pydantic-ai>=1,<2",
  "crewai>=0.100,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
markers = ["integration: real LangGraph/Pydantic AI/CrewAI (make test-integration)"]
