[project]
name = "hitl-before"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pytest>=8,<9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"
# The integration-group framework isn't installed in the default env.
reportMissingImports = "none"

[dependency-groups]
dev = ["pyright>=1.1.380,<2", "ruff>=0.6,<1"]
# The real thing: LangGraph interrupt() + checkpointer. Opt-in, still offline:
# `make test-integration` (deterministic nodes, no model needed).
integration = [
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
markers = ["integration: real LangGraph interrupt + checkpointer (make test-integration)"]
