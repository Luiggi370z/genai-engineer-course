[project]
name = "deploy-observe-after"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "opentelemetry-sdk>=1.30,<2",
  "pytest>=8,<9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"
reportMissingImports = "none"  # the OTLP exporter is integration-only

[dependency-groups]
dev = ["pyright>=1.1.380,<2", "ruff>=0.6,<1"]
# The real exporter, for when OTEL_EXPORTER_OTLP_ENDPOINT points at a collector.
integration = ["opentelemetry-exporter-otlp>=1.30,<2"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
