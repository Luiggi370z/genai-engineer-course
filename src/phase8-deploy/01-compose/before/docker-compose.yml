# The stack, first draft — it boots on a good day, which is not the same thing as
# deployable. Every weakness in here is one your checks in src/health.py must catch,
# and then you fix the wiring until `make test` is green:
#
#   - images are unpinned         -> every reviewer runs a different stack
#   - no healthchecks             -> depends_on has nothing meaningful to wait for
#   - depends_on is the list form -> waits for START, and a started Qdrant
#                                    is not a ready Qdrant
#   - every port is published     -> internal services are on the host network
#   - ollama pulls no models      -> the assistant boots against an empty model store
#
# The reference wiring is in ../after/docker-compose.yml — but write the checks
# first and let them tell you what to fix.
services:
  assistant:
    build: ../../../workshops/assistant/after
    environment:
      MCP_SERVER: http://mcp:8080/mcp
      QDRANT_URL: http://qdrant:6333
      OLLAMA_HOST: http://ollama:11434
      ASSISTANT_DB: /data/assistant.db
    volumes:
      - assistant-data:/data
    ports: ["8000:8000"]
    depends_on: [mcp, qdrant, ollama]

  mcp:
    build: ../../../workshops/assistant/after
    command: ["python", "-m", "assistant.mcp_server", "--http"]
    ports: ["8080:8080"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes:
      - qdrant-data:/qdrant/storage

  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes:
      - ollama-models:/root/.ollama

volumes:
  assistant-data:
  qdrant-data:
  ollama-models:
