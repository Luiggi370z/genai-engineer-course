# The HOST-MODEL overlay: borrow the machine's own Ollama instead of running one
# in the stack.
#
#   docker compose -f docker-compose.yml -f docker-compose.hostmodel.yml up --build
#   ./verify-e2e.sh --host-model      # what you actually want day to day
#
# Why this is an overlay and not an edit to the base file: the base stack's claim
# is that a stranger clones the repo, runs one command, and gets a working system
# with no setup and no keys. A stack that needs Ollama already installed and the
# right model already pulled does not make that claim, and check 1 of verify-e2e.sh
# is what proves it. So the self-contained `ollama` service stays the default, for
# reviewers and for CI, and this file is the local shortcut.
#
# The shortcut is worth having because the default is slow for a reason nothing in
# the compose file admits: Docker Desktop on macOS gives containers no GPU. The
# containerised Ollama therefore runs a 9B model on CPU inside a VM, measured at
# 0.52 tokens/second, against a composer budget of 60 seconds — so every answer
# came from the fallback tier and a full end-to-end pass spent seventeen of its
# twenty minutes waiting to abandon requests. The same machine's Ollama, with
# Metal, measured 81 tokens/second. Nothing about the code changes; the difference
# is entirely which side of the VM boundary the GPU is on.
#
# What it costs you: the run now depends on the host's Ollama and on the model
# named below being pulled there. `verify-e2e.sh --host-model` checks both before
# booting rather than letting it surface as a composer timeout twenty minutes in.
services:
  assistant:
    environment:
      # `host.docker.internal` is the host as seen from inside the network.
      OLLAMA_HOST: http://host.docker.internal:11434
      # Not pinned here on purpose: the point of this overlay is to use a model
      # that is already on YOUR machine, and which one that is depends on what you
      # have pulled. Defaults to the course model so the two lanes agree when it
      # is present.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
    # Docker Desktop resolves `host.docker.internal` on its own; on Linux it does
    # not exist until you map it to the gateway. One line, and the overlay works
    # the same on a laptop and on a workstation.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # `!override` replaces the base list instead of adding to it. Without it the
    # assistant would still wait for the `ollama` service to report healthy — a
    # service this overlay has just switched off, so the stack would wait forever
    # for a container that is never going to start.
    depends_on: !override
      mcp:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # Defined but not started: a profile nobody enables is a service `up` skips.
  # Left in the file rather than deleted so `--profile container-model` brings the
  # self-contained lane back without editing anything, and so the volume of pulled
  # models survives switching between the two.
  ollama:
    profiles: ["container-model"]
