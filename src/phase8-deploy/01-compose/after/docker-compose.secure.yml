# The SECURE profile — the same stack with the controls switched on.
#
#   ASSISTANT_JWT_SECRET=$(openssl rand -base64 48) \
#     docker compose -f docker-compose.yml -f docker-compose.secure.yml up --build
#
# The base file is a zero-key local demo and says so. This overlay is what you
# run when the stack is reachable by anything other than you: a Bearer JWT on
# every mutating endpoint, load shedding on, and the published port bound to
# loopback so "internal only" is enforced by the kernel rather than by intent.
#
# The secret comes from the environment, never from this file. A committed
# default is not a default, it is a published credential — the service refuses
# to start rather than fall back to one (`:?` below).
#
# For a real identity provider instead of a shared secret, add the OAuth overlay
# too; it swaps HS256 verification for RS256 against Keycloak's JWKS:
#
#   docker compose -f docker-compose.yml -f docker-compose.secure.yml \
#                  -f docker-compose.oauth.yml up --build
services:
  assistant:
    environment:
      # Auth: every mutating endpoint demands a token with exp, aud, sub and scope.
      ASSISTANT_JWT_SECRET: ${ASSISTANT_JWT_SECRET:?set ASSISTANT_JWT_SECRET (32+ bytes) before starting the secure profile}
      ASSISTANT_JWT_AUDIENCE: ${ASSISTANT_JWT_AUDIENCE:-assistant}
      # Clock skew is a policy: wide enough that two honest machines agree,
      # narrow enough that a revoked token stops working promptly.
      ASSISTANT_JWT_LEEWAY: "30"
      # Approvals expire faster under a real threat model than in a demo.
      ASSISTANT_APPROVAL_TTL: "120"
      # Load shedding: reject politely rather than degrade for everyone.
      RATE_LIMIT_RPS: "5"
      RATE_LIMIT_BURST: "10"
      MAX_CONCURRENCY: "4"
      # One budget for the whole request. Off in the demo profile because a
      # first-token wait on a cold local model is legitimately slow; on here,
      # because with only four concurrent slots an unbounded request is a
      # quarter of the service held hostage.
      #
      # It has to CONTAIN the composition budget, not undercut it. This said 120
      # while the composer was given 900, and the request budget silently won —
      # `deadline.capped` takes the tighter of the two — so the stack was
      # configured for a slow model and still cut every answer off at two
      # minutes. The stream showed it first: chunks, then the budget, then a
      # `done` frame reporting a truncated answer nobody could act on. Two
      # minutes is the composer's sixty seconds plus room for retrieval and tools
      # around it; both numbers came down together when the model moved to the
      # host's GPU, and they have to keep moving together.
      REQUEST_DEADLINE_SECONDS: "120"
    # `!override` replaces the base list instead of appending to it. Without it,
    # Compose merges sequences: the service ends up publishing 0.0.0.0:8000 AND
    # 127.0.0.1:8000, the second bind loses the port to the first, and the secure
    # profile cannot start at all — "failed to bind host port 127.0.0.1:8000/tcp:
    # address already in use", from a stack where nothing else wants that port.
    #
    # Worth knowing beyond this file: a hardening override that *adds* to a list is
    # the most common way a locked-down profile turns out to be the permissive one
    # plus extra. Here it failed loudly. A `cap_add` written the same way would not
    # have.
    ports: !override
      # Loopback only. The base file publishes 8000 on every interface, which is
      # correct for a laptop demo and wrong the moment the host has a public IP.
      # Put a TLS-terminating reverse proxy in front of this; the service speaks
      # plain HTTP on purpose and does not pretend otherwise.
      - "127.0.0.1:8000:8000"
    read_only: true # the image needs no writable root; /data stays a volume
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mcp:
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
