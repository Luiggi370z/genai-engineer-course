[project]
name = "compose-after"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pytest>=8,<9",
  "pyyaml>=6,<7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"
# oauth/ is a browser-driven script that imports the capstone package off sys.path
# at runtime. It is not part of this lesson's checked surface; the flow it calls is
# type-checked and unit-tested where it lives, in workshops/assistant.
exclude = ["oauth", "**/__pycache__", "**/.venv"]

[dependency-groups]
dev = ["pyright>=1.1.380,<2", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
