# The whole stack, one command: the capstone assistant + its MCP server + Qdrant +
# Ollama. Zero API keys. Both app services build from the SAME capstone image
# (workshops/assistant/after — see its Dockerfile); only the assistant's port ever
# leaves the compose network.
#
#   docker compose up --build
#   curl localhost:8000/health
#
# First boot is slow on purpose: the ollama service pulls its models AND loads one
# into memory before it reports healthy, and nothing that depends on it starts
# until it does. Reporting ready on a downloaded-but-cold model is the same lie as
# reporting ready on a container that has not started — the first request pays for
# it either way, and the fallback hides the evidence.
# Reliability posture, uniform across services: `restart: unless-stopped` brings a
# crashed container back (but respects an operator's explicit stop), memory/cpu
# limits keep one runaway service from starving the rest of the laptop, and
# `stop_grace_period` gives uvicorn/ollama time to drain in-flight work before
# SIGKILL.
services:
  assistant:
    build:
      context: ../../../workshops/assistant/after
      # Bakes the commit into the image so `/health` can report which code is
      # actually serving. A post-deploy smoke check compares it to the SHA it
      # just shipped — see phase8-deploy/03-deploy-observe/deploy/release.sh.
      # Defaults to `dev` outside CI, which is honest rather than wrong.
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 20s
    environment:
      MCP_SERVER: http://mcp:8080/mcp
      # The one lever that ungates a discovered tool, and it is on this side of
      # the wire on purpose. `lookup_fact` is a read against a fixed dictionary
      # in a server this repo also ships, which is the review the entry stands
      # for — everything else the server publishes stays behind /approve, no
      # matter how read-only it says it is.
      ASSISTANT_MCP_READONLY_ALLOWLIST: lookup_fact
      QDRANT_URL: http://qdrant:6333
      OLLAMA_HOST: http://ollama:11434
      ASSISTANT_DB: /data/assistant.db
      # The ollama service pulls this model; without naming it here the store
      # silently used `hash_embed`, which matches on shared vocabulary and not
      # on meaning — so the deployed stack answered "what is the reimbursement
      # policy" with nothing, while a page about refunds sat in the corpus. The
      # collection name carries the embedder and its width, so changing this
      # value starts a new collection instead of reading the old vectors as if
      # they meant the same thing.
      ASSISTANT_EMBED_MODEL: nomic-embed-text
      # The floor that lets a vector store say "nothing here". Without it,
      # nearest-neighbour search answers every question with its three
      # least-unrelated rows, and the composer grounds an answer in them — the
      # deployed stack cited three refund policies at a question about timezones.
      #
      # 0.58 is measured, not chosen. Against this corpus and this embedder, a
      # question answered in entirely different words ("how quickly do i get money
      # back for a work trip" -> the travel-expenses page) scores 0.66, and the
      # nearest document to a question the corpus does not answer scores 0.51.
      # 0.58 splits that gap with roughly equal margin on each side. Both numbers
      # move when the corpus or the embedder does, which is why this is a
      # deployment setting and not a constant in the code — see WORKSHOP-DEPLOYED-STACK.md
      # for the measurement, and re-run it before trusting this value elsewhere.
      ASSISTANT_MIN_SCORE: "0.58"
      # How long one composition may take before the offline stitcher answers
      # instead. The library default is 60 seconds, which suits a model with a
      # GPU under it; this stack does not have one. Docker Desktop exposes no
      # GPU to containers, so the 9B here runs at about half a token per second
      # and every answer arrived from the fallback — a stack that was working
      # exactly as configured, failing its own end-to-end check because of a
      # number compiled into the code. Fifteen minutes is the budget for a model
      # running on a CPU inside a VM; the host-model overlay puts it back to the
      # library default, because there slow really does mean broken.
      COMPOSE_TIMEOUT_SECONDS: "900"
      # Ship spans to a real collector with the observability overlay (adds a pinned
      # otel-collector and sets OTEL_EXPORTER_OTLP_ENDPOINT — see the overlay file):
      #   docker compose -f docker-compose.yml -f docker-compose.observability.yml up
      # Optional hardening/real connectors — the stack is zero-key without them:
      # ASSISTANT_JWT_SECRET: change-me-32-bytes-minimum-please! # Bearer JWT on every mutating endpoint
      # TELEGRAM_BOT_TOKEN: "123456:ABC..."                      # send_telegram talks to the real Bot API
      # NEWS_FEED_URL: https://hnrss.org/frontpage               # read_news fetches a real RSS feed
      # Load shedding (off by default; the service rejects politely when set):
      # RATE_LIMIT_RPS: "5"
      # RATE_LIMIT_BURST: "10"
      # MAX_CONCURRENCY: "4"
      # One deadline for the whole request, which every layer's timeout fits
      # inside. Off here so a cold local model's first token is not a 504; the
      # secure overlay turns it on, because there an unbounded request holds a
      # worker until somebody restarts the container.
      # REQUEST_DEADLINE_SECONDS: "120"
    volumes:
      - assistant-data:/data # memory survives a container restart — that is the point
    ports:
      - "8000:8000" # the ONLY published port; everything else stays internal
    depends_on: # wait for HEALTH, not for start — a started Qdrant isn't a ready Qdrant
      mcp:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      # /ready, not /health: the process being up is not the same claim as the
      # model tier being able to finish a request, and `depends_on:
      # service_healthy` is a promise to whatever starts next.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 10s
      timeout: 10s
      retries: 30

  mcp:
    build: ../../../workshops/assistant/after
    command: ["python", "-m", "assistant.mcp_server", "--http"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    stop_grace_period: 10s
    healthcheck:
      # the MCP endpoint answers POSTs, not GETs — an open socket is the readiness signal
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8080), 2)"]
      interval: 10s
      timeout: 3s
      retries: 12

  qdrant:
    # Tag AND digest. ':latest' means every reviewer runs a different stack, and a
    # tag alone only narrows that: a version tag is still a mutable pointer its
    # publisher can repoint at a rebuild. The digest is the content address, so this
    # line resolves to the same bytes next year or it fails loudly instead of
    # quietly running something else. The tag stays because `@sha256:0bd98f…` tells
    # a reader nothing about which Qdrant this is.
    image: qdrant/qdrant:v1.18.3@sha256:0bd98fa7977f1e75694779359ca4e212822e5a71334e28421182f72f209d5286
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 15s
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # the qdrant image ships no curl; bash's /dev/tcp probe is the standard workaround
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  ollama:
    image: ollama/ollama:0.32.5@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131 # pinned, same reason
    restart: unless-stopped
    mem_limit: 12g # a 9B model plus the embedder need real headroom
    cpus: 4.0
    stop_grace_period: 30s # let an in-flight generation finish before SIGKILL
    environment:
      # Ollama unloads an idle model after five minutes by default, which turns
      # every pause between checks into another cold start. Holding it resident
      # is what makes the warmup below stay true for the length of a run.
      OLLAMA_KEEP_ALIVE: 1h
    entrypoint: ["/bin/sh", "-c"]
    command: # bootstrap: serve, pull, WARM, then keep serving
      - |
        ollama serve &
        sleep 2
        ollama pull qwen3.5:9b
        ollama pull nomic-embed-text
        # A pulled model is a file on disk. Loading a 9B into memory on CPU takes
        # minutes, and the composer's budget is sixty seconds — so without this
        # line the first real question times out, the offline composer answers,
        # and a stack that reported itself healthy quietly serves a degraded
        # answer to whoever showed up first. Paying the load here means the
        # readiness signal and the truth agree.
        ollama run qwen3.5:9b "ok" >/dev/null 2>&1
        touch /tmp/warm
        wait
    volumes:
      - ollama-models:/root/.ollama # pulled models survive `compose down`
    healthcheck:
      # healthy = the models are downloaded AND one of them has completed a
      # generation. `ollama list` alone was the old check, and it is satisfied by
      # a model nobody can use yet. The image ships no curl, wget or python, so
      # the CLI and a sentinel file are the tools available — the assistant's
      # own /ready endpoint is what proves the round trip end to end.
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/warm && ollama list | grep -q qwen3.5 && ollama list | grep -q nomic-embed-text",
        ]
      interval: 15s
      timeout: 5s
      retries: 120 # first boot downloads ~6 GB and then loads it; patient, not broken

volumes:
  assistant-data:
  qdrant-data:
  ollama-models:
