name: ci
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: make test          # unit tests (fast tier), offline
      - run: make eval          # quality gate: fails if faithfulness/recall regressed
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: make redteam       # safety gate: fails if any gated tool fired unapproved
# Make BOTH jobs required in branch protection: no green, no merge.
