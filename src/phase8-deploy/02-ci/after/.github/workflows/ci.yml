name: ci
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: make test          # unit tests (fast tier), offline
      - run: make eval          # quality gate: fails if faithfulness/recall regressed
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: make redteam       # safety gate: fails if any gated tool fired unapproved
  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: make latency       # P99 gate: the tail is what users feel
      - run: make cost          # cost gate: spend regressions fail here, not on the invoice
      - run: make prove-gates   # seeded regressions must block — proves the gates can fail
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/report.json
# Make ALL jobs required in branch protection: no green, no merge.
