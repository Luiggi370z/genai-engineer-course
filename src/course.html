retrieval + reranking, eval-first habits, layered guardrails. Benchmark on your own data, and treat any single salary number as directional.`},_=[{id:`pre-1`,text:`**Python (comfortable)** — type hints, async/await, Pydantic, uv or poetry, pytest`},{id:`pre-2`,text:`**APIs & HTTP** — verbs, status codes, auth (API keys, OAuth2), JSON, SSE/streaming, retry with backoff`},{id:`pre-3`,text:`**Git/GitHub** — branching, PRs, code review`},{id:`pre-4`,text:`**Docker basics** — Dockerfile, docker compose, multi-stage builds`},{id:`pre-5`,text:`**A cloud** — any of AWS/GCP/Azure: compute, object storage, secrets, a managed Postgres`},{id:`pre-6`,text:`**SQL** — joins, indexes, basic tuning (pgvector will feel familiar)`},{id:`pre-7`,text:`**Design patterns** — adapter/strategy and dependency injection carry this whole course`},{id:`pre-8`,text:`**Optional hardware** — any 16GB+ machine runs the local-model lessons; more RAM unlocks stronger models (sizing table in Phase 1). No GPU at all? Hosted budget tiers cover everything.`},{id:`pre-9`,text:`**Light math** — vectors, cosine similarity, probability intuition. No PhD required, promise`}],v=[{title:`The expensive-router myth`,text:`The original chart says to route with the priciest model and do the work with the cheapest. In practice it’s usually the reverse: **triage with a cheap, fast model** (even a local 8B) and escalate only the hard cases — or put the strong model on **planning** and let cheap workers execute. Pick model strength per task, per node.`},{title:`Plain vector search is a 2023 answer`,text:`Embedding-only retrieval whiffs on exact things — invoice numbers, statutes, error codes. **Hybrid search (keyword + vectors) plus a reranker is today’s starting line**, not a bonus round.`},{title:`Projects > certificates — with a catch`,text:`Three shipped projects really do outweigh a wall of certificates — **but only if they carry numbers**: eval scores, latency, cost, a one-command deploy. A demo without metrics is just a certificate with extra steps.`},{title:`What the chart forgot entirely`,text:`Security and **guardrails** (prompt injection is OWASP’s #1 LLM risk), an **evaluation habit** (golden sets in CI), **local models** (Ollama/MLX), and knowing when to fine-tune vs retrieve. All four are woven through this course.`}],y=[{stage:`Foundations + retrieval (phases 1–2, Workshop 2)`,bar:`A RAG service that runs from one command, answers with citations, and abstains when the corpus can’t support an answer. Can’t hit it? Stay — the fix-it playbook is the syllabus.`},{stage:`Proof (phase 3, Workshop 3)`,bar:`Faithfulness ≥ 0.85 and context recall ≥ 0.80 on a 50-question golden set, scored by a judge you calibrated against your own labels, gating merges in CI. A number you can’t defend is not a number.`},{stage:`Agents (phase 4, Workshop 4)`,bar:`Explain the loop cold, build a tool properly, and ship a personal assistant with HITL on every irreversible action. Justify your framework choice out loud.`},{stage:`Memory + collaboration (phase 5, Workshop 5)`,bar:`The assistant recalls a fact from a previous session, cites where it learned it, drops a fact you corrected — and a tiered crew reports its cost next to the quality score, not instead of it.`},{stage:`Design + defense (phase 6, Workshop 6)`,bar:`Run the 8-step design script; name the attack families and their defenses; harden the assistant so no landed injection can fire a gated tool, proven by a red-team suite in CI.`},{stage:`MCP + deployment (phases 7–8, Workshops 7–8)`,bar:`Your own MCP server, consumed by your assistant via discovery, with correct auth; the whole stack deployed from one command, CI-gated on evals + red-team, observable.`},{stage:`Job hunt (phase 9)`,bar:`Every resume bullet carries a number mined from a workshop; funnel tracker live; daily reps running.`},{stage:`Electives — only on demand`,bar:`Fine-tuning mechanics, multimodal, voice, scaled GPU serving (vLLM), GraphRAG: add one only when it shows up in ≥3 target job descriptions.`}],b=[{id:`p1`,weeks:`Weeks 1–2`,color:`#0E9F6E`,title:`Speak Fluent LLM`,tagline:`Get comfortable talking to any model — the big clouds and the one running on your laptop. Everything later debugs back to here.`,tldr:"One client reaches every provider — hosted and local — with streaming, tools and schema-constrained output behind a single call. You bill each call from the `usage` object rather than an estimate, and build a RAG pipeline by hand so every later stage has a name you already know.",objectives:[{id:`p1-o1`,text:`**Implement** one client that reaches Anthropic, OpenAI, Google **and local models (Ollama/MLX)** — streaming, tools and structured outputs behind a single call`},{id:`p1-o2`,text:"**Measure** real cost per call — count with each vendor’s own tokenizer, then bill from the `usage` object rather than an estimate"},{id:`p1-o3`,text:`**Construct** a small but honest RAG pipeline by hand — chunk, embed, index, retrieve — and justify why each stage exists`},{id:`p1-o4`,text:`**Constrain** a model’s output with a schema so answers parse on the first try, and compare violation rates hosted vs. local`},{id:`p1-o5`,text:`**Explain** which part of a prompt is cacheable, and order your messages so the stable prefix survives from one call to the next`}],concepts:[{id:`p1-c1`,title:`Meet the players (June 2026 lineup)`,tag:`orientation`,teaches:[`p1-o1`],blocks:[{kind:`p`,text:`Three storefronts, one skill. Each vendor sells a **flagship** (expensive, brilliant), a **default** (the one you actually use daily), and a **budget tier** (for routing and grunt work). Learn the pattern, not the names — the names change quarterly.`},{kind:`table`,headers:[`Vendor`,`Flagship`,`Daily default`,`Budget tier`],rows:[[`Anthropic`,`Opus 4.8 · $5/$25 (Fable 5 above it)`,`Sonnet 4.6 · $3/$15`,`Haiku 4.5 · $1/$5`],[`OpenAI`,`GPT-5.5 · $5/$30`,`GPT-5.2 · $1.75/$14`,`GPT-5.4 mini/nano`],[`Google`,`Gemini 3.1 Pro · $2/$12 (3.5 Pro not GA yet)`,`Gemini 3.5 Flash · $1.50/$9`,`3.1 Flash-Lite · $0.25/$1.50`]]},{kind:`p`,text:`And a fourth player that’s actually you: **open-weight models** — Gemma 4, Qwen 3.5/3.6, gpt-oss, Llama 4 — running on your own machine for **$0 per token**. What fits depends on your RAM; the sizing table in the next card covers everything from an 8GB laptop to a workstation (and the zero-GPU path too).`},{kind:`callout`,tone:`tip`,title:`The one lesson that outlives every model`,text:`Wrap providers behind an **adapter** so swapping models — hosted or local — is a config change, never a refactor. This single design choice powers the cost ladder in Phase 5 and the “runs-anywhere” portfolio flex in Phase 8.`}]},{id:`p1-c2`,title:`Your laptop is a model server now`,tag:`local-first`,teaches:[`p1-o1`],blocks:[{kind:`p`,text:"Think of **Ollama** as Docker for models: `ollama run qwen3.5:8b` and you’re serving. On Apple Silicon, **MLX** squeezes extra speed from unified memory. Here’s the kicker — both expose an **OpenAI-compatible endpoint**, so “local support” costs you one config entry, not a new code path."},{kind:`table`,headers:[`Your machine (RAM)`,`What runs well (Ollama tags)`,`What it unlocks`],rows:[[`~8 GB`,`gemma4:e2b · nomic-embed-text`,`Light chat, embeddings, learning the APIs`],[`16 GB`,`qwen3.5:8b · gemma4:e4b · gpt-oss:20b`,`The whole course locally: routing, agents, guard models`],[`24 GB (or a 24GB GPU)`,`+ qwen3.6:27b · gemma4:31b (Q4)`,`Best local coding + generalist quality on consumer hardware`],[`32–64 GB`,`+ qwen3-coder 30B-A3B (the MLX-on-Mac favorite)`,`Agentic coding, bigger contexts, a free local eval judge`],[`64 GB+ / 80GB GPU`,`+ qwen3-coder-next · gpt-oss:120b`,`Open frontier-class reasoning and coding`],[`No GPU / older laptop`,`Hosted budget tiers or Ollama cloud models`,`Same code, same lessons — just a different base_url`]]},{kind:`p`,text:`Rule of thumb: a model’s Q4 download size ≈ the RAM it needs, plus a few GB of headroom for context. And the RAG essentials — **BGE-M3 embeddings + BGE-reranker-v2** — run on nearly anything, so a fully local retrieval stack is possible at 16 GB.`},{kind:`deepdive`,title:`That “Q4” in the table — quantization formats, and where the quality cliff is`,blocks:[{kind:`p`,text:`A 27-billion-parameter model at full precision is ~54 GB of weights; the tag you actually pull is ~16 GB. **Quantization** is the difference — storing each weight in 4 bits instead of 16, trading a little accuracy for a model that fits in the RAM you own. It works at all because LLM weights are enormously redundant. Which format you want depends on where it runs.`},{kind:`table`,headers:[`Format`,`Runs on`,`Size vs. fp16`,`Use it when`],rows:[[`**Q8_0** (GGUF)`,`Ollama, llama.cpp, CPU or GPU`,`~50%`,`You have RAM to spare and want the quality ceiling — practically indistinguishable from fp16`],[`**Q5_K_M** (GGUF)`,`same`,`~35%`,`The step you take when Q4 feels slightly dumb and you have a few GB free`],[`**Q4_K_M** (GGUF)`,`same`,`~28%`,`The default, and what Ollama gives you when you don’t specify. Best quality-per-gigabyte on consumer hardware`],[`**Q3 / Q2**`,`same`,`~15–22%`,`Almost never. This is where the quality cliff is — instruction-following and arithmetic degrade first, and the model gets subtly worse rather than obviously broken`],[`**AWQ / GPTQ**`,`GPU serving (vLLM, TGI)`,`~28%`,`You’re serving many concurrent users from a real GPU. 4-bit like Q4, but laid out for batched GPU inference instead of CPU/unified memory`]]},{kind:`callout`,tone:`warn`,title:`The dangerous failure mode is subtle, not loud`,text:`An over-quantized model doesn’t crash or emit garbage — it starts ignoring one instruction in ten, miscounting, and dropping fields from your schema. It *looks* fine in a demo. This is precisely why Phase 3 makes you build an eval suite: quantization choices are only defensible against numbers you measured yourself.`}]},{kind:`p`,text:`So when should you self-host at all? Four honest reasons — and the bill that comes with them:`},{kind:`list`,items:[`**Privacy** — the data legally cannot leave.`,`**Volume** — at millions of cheap calls, the GPU amortizes.`,`**Latency floor** — no network hop.`,`**The dev loop** — a free, rate-limit-free model to iterate against.`,`**The bill:** you give up the quality ceiling, million-token windows and tool-calling reliability — and you become the ops team. Most production systems route rather than choose: local for the cheap high-volume steps, hosted for the quality-critical one. Phase 8 turns that into a cost ladder.`]},{kind:`code`,title:`One client, every provider`,code:`@dataclass(frozen=True)
class Provider:
    base_url: str | None   # None = vendor default
    api_key: str
    model: str

PROVIDERS = {
    "claude": Provider(None, env("ANTHROPIC_API_KEY"), "claude-sonnet-4-6"),
    "gpt":    Provider(None, env("OPENAI_API_KEY"), "gpt-5.5"),
    "local":  Provider("http://localhost:11434/v1", "ollama", "qwen3.5:8b"),
}

def complete(prompt: str, provider: str = "local", temperature: float = 0.2) -> str:
    p = PROVIDERS[provider]
    client = OpenAI(base_url=p.base_url, api_key=p.api_key)
    resp = client.chat.completions.create(
        model=p.model, temperature=temperature,
        messages=[{"role": "user", "content": prompt}],
    )
    return resp.choices[0].message.content

# complete("Classify: 'refund failed twice'")  # runs free, on your machine`}]},{id:`p1-c3`,title:`Two API tricks you’ll use every single day`,teaches:[`p1-o1`],blocks:[{kind:`list`,items:[`**Streaming** — tokens arrive as they’re generated (SSE). The difference between an app that feels alive and one that feels frozen. It doesn’t make the answer faster; it makes the *wait* visible, which is why Phase 8 measures time-to-first-token separately from total latency.`,`**Tool calling** — the model **asks** to run one of your functions; **your code** executes it and reports back. The model never touches your runtime. Local models can do this too (Qwen 3.5+, gpt-oss), just less reliably — validate and retry. Phase 4 turns this single trick into an agent loop.`]},{kind:`callout`,tone:`tip`,title:`The third trick got its own card`,text:`Structured outputs — forcing the model to answer in *your* shape — used to be a bullet here. It earned promotion: it is the difference between an app that parses and one that guesses, and every provider does it differently. Next card.`}]},{id:`p1-c-schema`,title:`Structured outputs: stop parsing, start declaring`,tag:`schema-first`,teaches:[`p1-o4`],blocks:[{kind:`p`,text:`The naive way to get data out of a model is to ask nicely and then parse prose with regex. It works until the day the model says “Sure! Here's the JSON:” and your regex eats the preamble. **Structured outputs** invert the deal: you declare the shape, and the decoder is constrained so no other shape is reachable. Parse failures don’t get *rarer* — for the strict implementations they stop being possible.`},{kind:`p`,text:`The catch is that “structured output” names four different mechanisms with four different guarantees. Know which one you’re getting, because the weakest of them is just a prompt with good manners.`},{kind:`table`,headers:[`Provider`,`The mechanism`,`Guarantee`,`Where it bites`],rows:[[`OpenAI`,'`response_format: {type: "json_schema", strict: true}` (Chat Completions) or `text.format` (Responses)',`Grammar-constrained — the schema is enforced during decoding`,"Strict mode takes a **subset** of JSON Schema: every property must be `required`, `additionalProperties: false` is mandatory, and unions/recursion are limited. A separate `refusal` field can come back instead of your object"],[`Anthropic`,'Forced tool use — define the schema as a tool, then `tool_choice: {type: "tool", name: "..."}`',`The model must emit that tool’s input, so the shape holds`,"The answer arrives in a `tool_use` block, not in the text — your parsing code looks different from OpenAI’s even though the intent is identical"],[`Google`,'`response_schema` + `response_mime_type: "application/json"`',`Constrained decoding against the declared schema`,`Schema dialect is its own subset; deeply nested optionals are where it complains`],[`Ollama / local`,"`format` set to a JSON schema (or `Mode.JSON` via Instructor)",`Enforced by the local runtime’s grammar sampler`,'Small models satisfy the *shape* and still fill it with nonsense. A valid `{"total": 0.0}` is not a correct invoice']]},{kind:`callout`,tone:`warn`,title:`Schema-valid is not fact-correct`,text:`Constrained decoding guarantees the JSON parses, nothing more. It cannot make a field true. That is exactly the gap Phase 3 exists to measure — validity is a type check, accuracy is an eval.`},{kind:`p`,text:"Four mechanisms, one interface. **Instructor** wraps all of them behind a Pydantic model: you write the model once, and the provider difference collapses into a `mode=` argument. That is the same adapter bet as card 1 — own the interface, rent the implementation."},{kind:`code`,title:`One Pydantic model, hosted or local`,code:`class Ticket(BaseModel):
    category: Literal["billing", "bug", "account"]   # an enum, not a str
    priority: int = Field(ge=1, le=5)                # constrained, not hoped-for
    summary: str

client = instructor.from_openai(OpenAI())          # hosted: native strict json_schema
# local: same code, one swap — the schema is enforced by Ollama's sampler
# client = instructor.from_openai(
#     OpenAI(base_url="http://localhost:11434/v1", api_key="ollama"),
#     mode=instructor.Mode.JSON,
# )

ticket = client.chat.completions.create(
    model="gpt-5.5",                # or "qwen3.5:8b"
    response_model=Ticket,          # guaranteed shape, zero regex
    max_retries=2,                  # validation errors are fed back, not swallowed
    messages=[{"role": "user",
               "content": "My payment failed three times and I'm furious."}],
)

# The types earn their keep: Literal collapses "Billing"/"billing"/"BILLING" into
# one branch, and ge/le stops a priority of 11 from reaching your router.`},{kind:`callout`,tone:`tip`,title:`Put the constraint in the type, not the prompt`,text:"“Please answer 1–5” is a request. `Field(ge=1, le=5)` is a contract — checked by Pydantic, and on strict providers by the decoder itself. Every constraint you move from prose into the schema is one fewer thing to validate downstream. Exercise 3 measures how much that buys you, hosted vs. local."}]},{id:`p1-c4`,title:`Tokens: the taxi meter is always running`,teaches:[`p1-o2`,`p1-o5`],blocks:[{kind:`predict`,prompt:`Two ways to run the same chatbot turn. **(A)** One call with a 40,000-token system prompt, asked once. **(B)** The same 40,000-token prompt, asked 50 times over a conversation, with a short new question each time. Same model, same output length. Before you read on: roughly how much more does B cost than A — 50×, or something else? Commit to a number.`,answer:`If you send it naively, B costs about 50× A, because you are re-sending those 40,000 tokens on every single turn. With **prompt caching** on and the stable prefix ordered first, turns 2–50 bill that prefix at 10–25% of list price, so B lands nearer 10–15× — and it comes back faster too, because cached prefix tokens skip most of the prefill.`,consolidation:"The lesson is not the discount, it is *where the discount lives*: caching keys on an exact prefix match, so a single volatile token near the top — a timestamp, a shuffled list of tools, the user’s name — invalidates everything after it and you silently pay full price. That is why objective 5 is about **message order** rather than about a config flag. Stable content first, volatile content last, and verify with the `cached` field in `usage` rather than trusting that you got it right."},{kind:`list`,items:[`Models read and write in **tokens** (~4 English characters each; code and non-English text differ a lot). You pay per token in **and** out, and latency grows with every one. Treat the context window like a taxi meter, not a backpack.`,"**Counting before you send (2026 practice):** every vendor tokenizes differently, so use each vendor’s own counter — Anthropic has a **free `count_tokens` endpoint**, Gemini has a `count_tokens` API, and OpenAI uses the local **tiktoken** library (`o200k_base` for GPT-4o/5.x). Using tiktoken for Claude undercounts by 15–20% — Anthropic says so themselves.","**Measuring after you send:** the `usage` object on every API response is the billing truth — input, output, **cached** tokens (75–90% cheaper when caching hits) and **reasoning** tokens (thinking models bill them as output; effort levels can 2x a bill without touching your prompt). Production teams compute cost from `usage`, never from estimates.",`Hosted windows are huge now (1M+). Local models give you 8K–128K — design for the small case and the big one is free.`,`**More context can make answers worse.** Research (Chroma’s “context rot”) shows accuracy sliding as you stuff the window. A giant window is not a retrieval strategy.`,"Sampling cheat sheet: `temperature` 0–0.2 for extraction and tools, 0.7+ for brainstorming. Tune temperature **or** top_p — never both."]},{kind:`code`,title:`Count before, measure after`,code:`# BEFORE - preflight count with the VENDOR's counter (tokenizers differ!)
count = anthropic.Anthropic().messages.count_tokens(     # free endpoint
    model="claude-sonnet-4-6",
    messages=[{"role": "user", "content": big_prompt}],
).input_tokens
# OpenAI: tiktoken.get_encoding("o200k_base")  |  Gemini: client.models.count_tokens()

# AFTER - the response's usage object is the billing truth. Meter every call:
PRICE = {"claude-sonnet-4-6": (3.00, 15.00)}             # $/MTok in, out

def cost(model: str, usage) -> float:
    p_in, p_out = PRICE[model]
    cached = getattr(usage, "cache_read_input_tokens", 0)    # ~90% cheaper
    fresh = usage.input_tokens - cached
    return (fresh * p_in + cached * p_in * 0.1
            + usage.output_tokens * p_out) / 1e6             # reasoning bills as output

resp = client.messages.create(model="claude-sonnet-4-6", max_tokens=512,
                              messages=[{"role": "user", "content": q}])
log(cost("claude-sonnet-4-6", resp.usage))   # per-request truth -> your dashboard`},{kind:`callout`,tone:`warn`,title:`Tokenizers change under your feet`,text:"Anthropic’s Opus 4.7+ and Fable 5 tokenizer produces ~30% more tokens than older Claude models for the same text. Same prompt, new model, bigger bill — one more reason to meter with `usage` instead of trusting cached estimates."},{kind:`p`,text:"**Now the discount.** That `cache_read_input_tokens` line in the cost function isn’t a rounding error — cache hits bill at roughly a tenth of the input price. But caching is not something you switch on; it’s something your **prompt layout** either earns or throws away, and the mechanics are unglamorous enough that most people leave the money on the table."},{kind:`list`,items:[`**It caches a prefix, not a prompt.** The cache key is the exact token sequence from the start of your request up to the cache point. Change one character near the beginning and everything after it is a miss. This is the whole rule; everything below follows from it.`,`**Therefore: stable content first, volatile content last.** System prompt, tool definitions, few-shot examples, the retrieved document — those go up front. The user’s question, the timestamp, the session id go at the end. Put “Today is 2026-07-31 14:22” in your system prompt and you have built a cache that can never hit.`]},{kind:`deepdive`,title:`The fine print: minimums, TTL, and who marks the boundary`,blocks:[{kind:`list`,items:[`**There is a minimum length.** Anthropic won’t cache a prefix below **1,024 tokens** on Sonnet, or **4,096** on Opus and Haiku. Short prompts simply don’t qualify — which is fine, because they’re cheap anyway.`,`**The write costs extra, the read is the prize.** On Anthropic a 5-minute cache write runs ~1.25× base input and a read ~0.1×. So the break-even is the *second* hit: caching a prefix you use once is a small loss, caching one you reuse ten times is an ~85% saving on that segment.`,`**TTL is short and refreshes on use.** The default window is **5 minutes**, extended by each hit; a 1-hour TTL is available at ~2× the write price. Caching suits a burst — an agent loop, a multi-turn conversation, a batch over one big document — not overnight reuse.`,"**Explicit vs. automatic.** Anthropic makes you mark the boundary with `cache_control` on a content block. OpenAI caches long prefixes automatically and reports `cached_tokens` in `usage`. Both reward the same discipline; only one lets you forget about it."]},{kind:`code`,title:`Where you put the marker is the whole design`,code:`# The cache boundary goes AFTER everything stable. Anything below the marker
# is free to change every call without costing you the hit above it.
resp = client.messages.create(
    model="claude-sonnet-4-6",
    max_tokens=512,
    system=[
        {"type": "text", "text": TOOL_DOCS + STYLE_GUIDE},        # stable, ~4k tokens
        {"type": "text", "text": retrieved_doc,
         "cache_control": {"type": "ephemeral"}},                 # <-- cache up to here
    ],
    messages=[{"role": "user", "content": question}],             # volatile: below the line
)

u = resp.usage
print(u.cache_creation_input_tokens, u.cache_read_input_tokens)   # write once, then read
# First call: creation > 0, read == 0.  Every call after: read > 0. If read stays 0,
# something above the marker is changing — find it before you blame the vendor.`},{kind:`callout`,tone:`tip`,title:`Mechanics here, strategy in Phase 8`,text:`This card is only about making the cache *hit*. Deciding **when** caching is the right lever — versus routing the call to a cheaper model, or not making it at all — is the optimization ladder in Phase 8. Order matters there: cache first, because it changes cost without changing behaviour.`}]}]},{id:`p1-c5`,title:`Embeddings: GPS coordinates for meaning`,teaches:[`p1-o3`],blocks:[{kind:`p`,text:"An embedding turns text into a point in space where **nearby = similar in meaning**. “My card got declined” and “payment failure” land close together even though they share zero words. That’s the magic — and Phase 2 covers exactly where it breaks. Strong hosted options: Gemini Embedding 2, Cohere embed-v4, Voyage. Strong local: **BGE-M3**, Qwen3-Embedding, `nomic-embed-text` — a fully on-laptop RAG stack is normal now."},{kind:`flow`,title:`Picking a vector home`,shape:`decision`,nodes:[{label:`Where do the vectors live?`,sub:`Check the conditions in order and stop at the first yes — they are alternatives, not stages.`},{label:`On Postgres already, <10M vectors?`,sub:`pgvector — one less system to babysit`},{label:`Want zero ops?`,sub:`Pinecone serverless`},{label:`Self-host, fast filters?`,sub:`Qdrant`},{label:`Billion scale?`,sub:`Milvus`},{label:`Just prototyping?`,sub:`Chroma`}]},{kind:`callout`,tone:`warn`,title:`Check the hybrid box early`,text:`Chroma and plain pgvector don’t do **hybrid search** natively; Qdrant, Weaviate and Milvus do. You’ll want it by Phase 2 — choose accordingly.`},{kind:`code`,title:`Same meaning → nearby vectors`,code:`from sentence_transformers import SentenceTransformer
import numpy as np

embed = SentenceTransformer("BAAI/bge-m3")          # runs locally, free
v = embed.encode(["my card got declined",
                  "payment failure",
                  "great weather today"], normalize_embeddings=True)

cos = lambda a, b: float(np.dot(a, b))              # normalized -> dot = cosine
cos(v[0], v[1])   # ~0.7  close in meaning, zero shared words
cos(v[0], v[2])   # ~0.1  unrelated`}]},{id:`p1-c6`,title:`Your first RAG: a librarian with a highlighter`,teaches:[`p1-o3`],blocks:[{kind:`p`,text:`RAG is just this: instead of hoping the model memorized your docs, you **look up the relevant pages and hand them over with the question**. A librarian fetches the right book; a highlighter marks the passage; the model writes the answer from it.`},{kind:`flow`,title:`Offline: build the library`,nodes:[{label:`Documents`},{label:`Chunk`},{label:`Embed`},{label:`Index`}]},{kind:`flow`,title:`Online: answer a question`,nodes:[{label:`Question`},{label:`Embed it`},{label:`Fetch top-k chunks`},{label:`Prompt = chunks + question`},{label:`Grounded answer`}]},{kind:`list`,items:[`The highest-ROI prompt line in all of GenAI: **“Answer only from the context below. If it’s not there, say you don’t know.”**`,`Give the model a role, a task, and constraints. Show one example of the output format you want.`,`For long inputs, sandwich: instructions before **and** after the data.`,`Small local models need more hand-holding in prompts — annoying at first, but it forces you to write prompts that work everywhere.`]},{kind:`code`,title:`RAG in one function`,code:`def rag(question: str, chunks: list[str]) -> str:
    # 1. retrieve the most relevant chunks (real systems embed; this shows the shape)
    top = sorted(chunks, key=lambda c: overlap(question, c), reverse=True)[:3]
    context = "\\n\\n".join(top)
    # 2. ground the model in ONLY those chunks
    prompt = (
        "Answer using ONLY the context. If it's not there, say you don't know.\\n\\n"
        f"Context:\\n{context}\\n\\nQuestion: {question}"
    )
    return complete(prompt, provider="local")       # the Phase-1 client`}]},{id:`p1-c7`,title:`Zoom out: the whole RAG map`,tag:`big picture`,teaches:[`p1-o3`],blocks:[{kind:`p`,text:`Before we go deep, here’s the **entire production system on one card** — every step, one line each. Don’t memorize it; just get the shape. The rest of the course walks this map station by station, and you can come back here whenever you need to place a new idea.`},{kind:`flow`,title:`Pipeline A · Ingestion (offline — runs when documents change)`,nodes:[{label:`1 · Load`,sub:`PDFs, HTML, wikis, tickets`},{label:`2 · Parse & clean`,sub:`extract text, strip noise`},{label:`3 · Chunk`,sub:`split into retrievable pieces`},{label:`4 · Enrich`,sub:`context sentence + metadata`},{label:`5 · Embed`,sub:`text → meaning vectors`},{label:`6 · Index`,sub:`vector store + keyword index`}]},{kind:`flow`,title:`Pipeline B · Serving (online — runs on every question)`,nodes:[{label:`1 · Guard input`,sub:`injection & PII checks`},{label:`2 · Embed question`},{label:`3 · Retrieve wide`,sub:`keywords + vectors, top ~20`},{label:`4 · Rerank`,sub:`keep the best 3–5`},{label:`5 · Assemble prompt`,sub:`instructions + chunks + question`},{label:`6 · Generate`,sub:`grounded answer + citations`},{label:`7 · Guard output`,sub:`grounded? safe? else abstain`},{label:`8 · Trace`,sub:`log cost, latency, scores`}]},{kind:`table`,headers:[`Step`,`What it does (one line)`,`Where we go deep`],rows:[[`Chunking`,`Split documents so each piece can answer on its own`,`Phase 1 exercise + Phase 2`],[`Embeddings`,`Turn text into vectors where nearby = similar meaning`,`Phase 1 exercise + Phase 2`],[`Indexing`,`Store vectors + keywords for fast lookup`,`Phase 1 exercise + Phase 2`],[`Hybrid retrieval + rerank`,`Cast a wide net, then get picky`,`Phase 2`],[`Evaluation (RAGAS)`,`Score faithfulness & recall; gate changes in CI`,`Phase 3`],[`Agents & tools`,`Let the model act, on a leash`,`Phase 4`],[`Memory, crew, MCP`,`Recall, delegate, and speak the tool protocol`,`Phases 5 & 7`],[`Guardrails`,`Layered defenses on input AND output`,`Phase 6`],[`Cost, caching, observability`,`Meter every call; cache before you route`,`Phases 1 & 8`]]},{kind:`callout`,tone:`tip`,title:`The one-sentence version`,text:`Two pipelines: one **builds the library** when documents change, one **answers questions** at request time — with guardrails at both doors and a scoreboard watching everything. If you can draw this map from memory, you already outline like a senior in interviews.`}]}],example:{title:`Field story: one codebase, two trust zones`,text:`A health-tech team needed to summarize clinical notes but couldn’t let patient data leave their machines. They prototyped entirely on Ollama (free, private), proved the workflow, then flipped one config flag to send the **quality-critical** step to a hosted flagship — while PII redaction stayed local forever. Same code, two trust zones, zero refactor. That’s the adapter pattern paying rent.`},exercises:[{id:`p1-e1`,title:`Build the universal client`,repo:`phase1-foundations/01-universal-client`,rung:`faded`,task:`Make complete(prompt, provider) work across Anthropic, OpenAI, Google and Ollama (MLX too if you’re on a Mac). Normalize streaming and tool-call shapes. Start from the template in the companion repo.`,assesses:[`p1-o1`],solution:[`One adapter covers every OpenAI-compatible endpoint (OpenAI, Ollama, MLX) — only base_url changes.`,`Anthropic and Gemini get thin adapters that translate message + tool-call formats.`,`Model strings live in config. If a model name appears inline in your code, you’ve already lost.`]},{id:`p1-e2`,title:`Build a cost meter (count before, measure after)`,repo:`phase1-foundations/02-token-cost-meter`,rung:`faded`,task:`Pre-flight: count a big prompt with Anthropic’s free count_tokens endpoint AND with tiktoken, and record how far apart they are. Post-flight: write cost(model, usage) that reads the response’s usage object (including cached tokens) and logs dollars per request. Wire it into your universal client.`,assesses:[`p1-o2`],solution:[`The vendor counter vs tiktoken gap on Claude is real (15–20%) — seeing the number cures estimate-trust forever.`,`usage is the billing truth: input, output, cached, and reasoning tokens. Meter every call; your Phase-6 cost model and Project 2’s cost chart are this function grown up.`,`Keep the price sheet in config next to the model names — they change together.`]},{id:`p1-e3`,title:`Extraction shoot-out: cloud vs laptop`,repo:`phase1-foundations/03-structured-extraction`,rung:`faded`,task:`Pull {vendor, date, total} from 20 messy invoices using structured outputs on (a) a frontier model and (b) qwen3.5:8b locally. Compare schema-violation and field-accuracy rates.`,assesses:[`p1-o4`],solution:[`Both should hit ~0 schema violations (constrained decoding does that for free).`,`Field accuracy will differ — and that exact number is your evidence for model tiering in Phase 5. Keep it.`]},{id:`p1-e4`,title:`Chunk a real document`,repo:`phase1-foundations/04-chunking`,rung:`faded`,task:`Implement two splitters over the provided handbook: fixed-size (~512 tokens, 15% overlap) and heading-aware (split on markdown structure, then size-cap). Print the worst chunk from each — the one that makes least sense alone — and say why.`,assesses:[`p1-o3`],solution:[`Fixed-size cuts mid-thought at section boundaries; heading-aware keeps ideas whole but produces uneven sizes. Every chunker trades one failure for another — that’s why Phase 2 measures instead of guessing.`,`Overlap is the cheap insurance: facts that straddle a boundary survive in one of the two copies.`]},{id:`p1-e5`,title:`Embed, index, search — a mini vector store`,repo:`phase1-foundations/05-embed-index`,rung:`faded`,task:`Embed your chunks with a local model (nomic-embed-text via Ollama’s OpenAI-compatible endpoint), build an in-memory index with numpy, and write search(query, k) returning the top-k chunks by cosine. Then ask it something phrased with completely different words than the text.`,assesses:[`p1-o3`],solution:[`Normalize the vectors once at index time; then cosine similarity is a single matrix–vector product — that IS a vector store, minus the ops.`,`The different-words query landing on the right chunk is the embeddings “aha.” Also try an exact ID — watch it miss, and remember that miss in Phase 2.`,`Swapping numpy for Qdrant later changes two functions, not your architecture.`]},{id:`p1-e6`,title:`Blank editor: rebuild the pipeline from memory`,rung:`independent`,task:"Empty directory, `uv init`, one file. From memory — no scrolling back, no `after/` open in another tab — write: a `complete(prompt, provider)` that reaches at least two providers, a `cost(model, usage)` that reads real usage, a chunker, an embedder, and `search(query, k)`. Then answer one question about a document you paste in, and print what the answer cost. Give yourself 90 minutes and keep whatever you produce, however ugly.",assesses:[`p1-o1`,`p1-o2`,`p1-o3`],solution:[`You reached for the SDK docs, not for exercise 1’s solution. Looking up a parameter name is research; looking up the shape of the thing is a sign the scaffold was doing the thinking.`,"Your `cost()` reads the response’s `usage` object rather than estimating from character counts. If you multiplied by 4 characters-per-token, you have rebuilt the habit this phase exists to break.",`The chunker has an overlap and you can say why. The number matters less than having a reason for it.`,`It runs end to end. Not elegantly — end to end. A pipeline you can reconstruct from an empty file is a pipeline you actually understand, and this is the first honest signal you have had that the last five exercises stuck.`,`Where you stalled is the useful output. Note it, then reread that one card. That gap is what the five scaffolds were hiding from you.`]}],workshop:{id:`w-bench`,title:`Workshop · The model bench`,subtitle:`A CLI that runs one real task across every provider and reports tokens, cost and latency side by side — ranked on the number that actually decides the purchase.`,repo:`workshops/model-bench`,assesses:[`p1-o1`,`p1-o2`,`p1-o4`],blocks:[{kind:`p`,text:`Your team is about to ship an extraction feature and someone asks the only question that matters: **which model should we use?** The answers in the room are a vendor blog post, a leaderboard nobody can reproduce, and one engineer’s vibe. None of them survive a follow-up question. Build the thing that does.`},{kind:`p`,text:`This is the one standalone workshop — Workshops 2 through 8 grow a single evolving assistant, and this is the instrument you measure it with. It is also just the three things you already built, pointed at each other: the **adapter** from exercise 1, the **meter** from exercise 2, the **schema** from exercise 3. That is why it belongs here and not in a “tooling” appendix.`},{kind:`flow`,title:`One task, every candidate, one ranking`,nodes:[{label:`Candidates`,sub:`config entries: local · gpt-mini · gpt`},{label:`Runner`,sub:`injected — fake offline, real in the live tier`},{label:`Per case`,sub:`time it · meter it · validate it`},{label:`Row`,sub:`tokens, $, p50/max, success rate`},{label:`Rank`,sub:`cost per successful parse`}]},{kind:`callout`,tone:`warn`,title:`Rank on the right axis or don’t rank at all`,text:"The most common way a model comparison lies is by sorting on price per token. Tokens are not the unit you buy — **working answers** are. A model at half the price that fails three cases in four is not a bargain, it is a retry loop wearing a discount. `cost_per_success` is the whole reason this bench is worth building."},{kind:`code`,title:`The seam you implement`,code:`# before/src/bench/core.py
def run_case(candidate, prompt, runner, validate, clock) -> Result:
    # TODO: time the call, bill it from usage, validate the reply
    # TODO: this must NEVER raise — a dead vendor is a row, not a crashed run
    ...

@property
def cost_per_success(self) -> float:
    # TODO: spend / answers you can actually use.
    # TODO: decide what zero successes means, and make sorted() agree with you.
    ...`},{kind:`callout`,tone:`tip`,title:`You will keep coming back to this`,text:`Every later phase that claims a cheap tier is good enough — the tiered crew in Phase 5, the optimization ladder in Phase 8 — needs a number from *your* task mix, not a vendor’s. This is the tool that produces it.`}],deliverables:[{id:`w-bench-d1`,text:`A provider is a **config entry, not a code path** — the runner is injected, and the fast test tier benches four candidates with zero network`},{id:`w-bench-d2`,text:"Every row reports **tokens, cost and latency**, with cost computed from the response’s `usage` and never from a pre-flight estimate"},{id:`w-bench-d3`,text:`Each reply is **validated against a schema**, so the row reports a success rate instead of assuming the call worked`},{id:`w-bench-d4`,text:`Ranking is by **cost per successful parse** — and a test proves the half-price model that fails three in four is the worse buy`},{id:`w-bench-d5`,text:`A provider that errors or times out becomes a **row with an error**, never a crashed run — one dead vendor can’t hide the other three`},{id:`w-bench-d6`,text:"`--json` emits the same numbers as the table, so today’s bench can be **diffed against last month’s**"},{id:`w-bench-d7`,text:`The integration tier runs the identical bench against a **real local model** and reports what it actually costs and how often it holds the schema`}],stretch:[`Add a quality column. The bench measures whether an answer parses, not whether it is right — hand-label expected values and report field accuracy next to cost. You have just built the smallest possible version of Phase 3, which is the honest way to find out why Phase 3 needs four lessons.`,"Bench prompt caching: send the same long prefix twice and read `cache_read_input_tokens` on the second call. If it stays zero, hunt down what is changing above your cache point.","Add a budget gate — `--max-cost 0.02 --min-success 0.9` exits non-zero when no candidate clears both bars. That is a CI gate, and Phase 8 turns it into one."]},checkpoint:[{id:`p1-q1`,q:`Why are structured outputs better than parsing prose with regex — and how do they differ from tool calling?`,a:`Constrained decoding guarantees the output matches your schema, so parse failures basically vanish and the schema lives in code. Tool calling is the model requesting an **action** from your code; structured outputs shape the **final answer**. Actions vs data.`},{id:`p1-q2`,q:`Your RAG answers feel vague and generic. Name three Phase-1 suspects before blaming the model.`,a:`(1) Retrieval is fetching irrelevant chunks. (2) The prompt never forces grounding (“answer only from context” missing). (3) The window is overstuffed and the good chunk is lost in the middle. Check those before paying for a bigger model.`},{id:`p1-q3`,q:`When is a 1M-token window NOT the fix for a retrieval problem?`,a:`Nearly always at scale: context rot degrades accuracy, cost and latency grow with every token, and your corpus won’t fit anyway. Retrieval picks the right tokens; a big window just tolerates more wrong ones.`},{id:`p1-q4`,q:`When does a local model beat a hosted one — and what’s the trade?`,a:`Privacy/data residency, offline work, zero-cost dev loops and bulk batch jobs. You trade away the quality ceiling, big windows, and tool-calling reliability — and you become the ops team.`},{id:`p1-q5`,q:`Why is the response’s usage object the source of truth for cost, rather than any pre-flight estimate?`,a:`Estimates drift: tokenizers differ per vendor (tiktoken undercounts Claude 15–20%), tokenizers change between model versions, caching discounts what you actually pay, and reasoning tokens are invisible before the call but billed as output. usage reports what the vendor actually charged — meter it per request and build dashboards on that.`},{id:`p1-q6`,q:"You added prompt caching to an agent that re-reads the same 6,000-token tool manual every turn, but `cache_read_input_tokens` is always 0. What did you almost certainly do wrong?",a:`Something **before** the cache point changes every call. The cache key is the exact token prefix from the start of the request, so a timestamp, a session id, a turn counter or a shuffled tool list sitting in the system prompt invalidates everything after it. Fix: stable content first (tool docs, examples, retrieved document), volatile content last (the user’s turn). Also check the prefix clears the minimum — 1,024 tokens on Sonnet, 4,096 on Opus and Haiku — and that the gap between calls is inside the 5-minute TTL.`}],resources:[{label:`Anthropic API docs — models overview`,url:`https://platform.claude.com/docs/en/about-claude/models/overview`},{label:`Anthropic — token counting endpoint`,url:`https://platform.claude.com/docs/en/build-with-claude/token-counting`},{label:`OpenAI cookbook — counting tokens with tiktoken`,url:`https://developers.openai.com/cookbook/examples/how_to_count_tokens_with_tiktoken`},{label:`Anthropic — prompt caching (cache_control, minimums, TTL, pricing)`,url:`https://platform.claude.com/docs/en/build-with-claude/prompt-caching`},{label:`OpenAI — structured outputs & strict JSON Schema`,url:`https://developers.openai.com/api/docs/guides/structured-outputs`},{label:`Instructor — one Pydantic model across every provider`,url:`https://python.useinstructor.com`},{label:`OpenAI API docs — models`,url:`https://developers.openai.com/api/docs/models`},{label:`Google Gemini API docs`,url:`https://ai.google.dev/gemini-api/docs`},{label:`Ollama — model library & OpenAI compatibility`,url:`https://ollama.com`},{label:`MLX (Apple Silicon inference)`,url:`https://github.com/ml-explore/mlx`},{label:`MTEB leaderboard — embedding rankings`,url:`https://huggingface.co/spaces/mteb/leaderboard`},{label:`pgvector`,url:`https://github.com/pgvector/pgvector`},{label:`Qdrant docs`,url:`https://qdrant.tech`}]},{id:`p2`,weeks:`Weeks 3–4`,color:`#2563EB`,title:`Retrieval That Actually Works`,tagline:`Toy RAG demos take an afternoon. Here you build retrieval you can defend with numbers — and debug under interview pressure.`,tldr:`Hybrid search plus a reranker, chunking chosen from evidence rather than blog folklore, and an offline gate of sliced golden questions that makes every retrieval change measurable. Ends with the stage-by-stage debugging drill interviewers actually hand you.`,objectives:[{id:`p2-o1`,text:`**Combine** keyword + vector search with a reranker, and justify why each piece earns its keep`},{id:`p2-o2`,text:`**Choose** chunking by evidence, not blog folklore`},{id:`p2-o3`,text:`**Build** a fast, offline gate — sliced golden questions plus lexical metrics — so every retrieval change is measurable before Phase 3 makes it judged`},{id:`p2-o4`,text:`**Diagnose** a broken RAG system stage by stage — the thing interviewers actually hand you`}],recall:[{id:`p2-r1`,q:"Your retriever misses every query that contains an invoice number like `INV-88231`, even though the document is definitely in the index. Using only what Phase 1 taught you about embeddings, why?",a:"Embeddings encode *meaning*, and an opaque ID has none — the tokenizer shreds `INV-88231` into sub-token fragments that sit nowhere useful in vector space, so cosine similarity has nothing to latch onto. This is the exact miss you were told to remember at the end of the embed-and-index exercise, and it is the entire argument for the hybrid search you are about to build.",from:`p1-o3`},{id:`p2-r2`,q:`Without looking: which field on an API response tells you what a call actually cost, and why is estimating from character count not good enough?`,a:"The `usage` object — input, output, cached and reasoning tokens. Estimating is wrong in both directions: tokenizers differ per vendor by 15–20% on the same text, cached tokens bill at a fraction of list price, and thinking models bill reasoning tokens you never see in the output. You will need this in a moment, because a reranker changes your cost profile and you cannot claim it is worth it without the real number.",from:`p1-o2`},{id:`p2-r3`,q:`You are told to swap your vector store from numpy to Qdrant. How much of a well-built Phase 1 pipeline has to change, and what does that tell you about where the real design decisions were?`,a:`Two functions: index and search. Everything else — chunking, embedding, the retrieval contract — is untouched, because the store was always behind an interface. The decisions that mattered were chunking and what you embed; the database was an implementation detail. Hold onto that, because this phase is going to spend all its effort on the parts that actually move recall.`,from:`p1-o3`}],concepts:[{id:`p2-c1`,title:`Why Ctrl+F still matters`,tag:`core`,teaches:[`p2-o1`],blocks:[{kind:`p`,text:`Embeddings are a brilliant librarian who understands what you **mean** — and completely whiffs on “invoice INV-88231” because IDs get shredded into meaningless sub-tokens. Old-school keyword search (BM25) is Ctrl+F with a ranking brain: dumb about meaning, deadly on exact strings. **Use both, fuse the rankings (RRF), and you cover each other’s blind spots.** Qdrant, Weaviate and Milvus do this natively.`},{kind:`flow`,title:`Cast a wide net, then get picky`,nodes:[{label:`Question`},{label:`Hybrid fetch`,sub:`keywords + vectors, top 20–150`},{label:`Reranker`,sub:`reads each pair properly`},{label:`Best 3–5 survive`},{label:`Generate`}]},{kind:`p`,text:`The **reranker** is a second interviewer: slower, but it actually reads the candidate with the question instead of comparing résumé keywords. Cohere Rerank and Voyage are hosted picks; **BGE-reranker-v2 runs free on your laptop** and pairs perfectly with an all-local stack.`},{kind:`code`,title:`Fuse keyword + vector ranks (RRF)`,code:`# You do NOT write this. Qdrant fuses both arms server-side:
hits = client.query_points("docs",
    prefetch=[models.Prefetch(query=dense_q,  using="dense", limit=20),
              models.Prefetch(query=sparse_q, using="kw",    limit=20)],
    query=models.FusionQuery(fusion=models.Fusion.RRF),
    limit=5).points

# What RRF is doing under the hood, for your own understanding:
#   score(doc) = sum over each ranked list of  1 / (k + rank)      (k is ~60)
# Rank-based, so it needs no score calibration between the two arms -- which is
# exactly why it beats trying to average a BM25 score with a cosine score.`}]},{id:`p2-c2`,title:`Upgrades ranked by payoff`,teaches:[`p2-o1`,`p2-o2`],blocks:[{kind:`predict`,prompt:`Your Phase 1 pipeline retrieves the right chunk 61% of the time and you have one afternoon. Rank these four by how much recall each buys: **(a)** upgrade to the best embedding model money can buy, **(b)** add BM25 alongside vectors and fuse the rankings, **(c)** prepend one model-written sentence of context to each chunk before embedding, **(d)** halve your chunk size. Write your ranking down before reading the list below.`,answer:`Roughly **c, b, d, a**. Contextual retrieval — that one prepended sentence — cut retrieval failures by about 49% in Anthropic’s measurements, and by 67% combined with reranking. Hybrid fusion is next and nearly free. Chunk size matters but is corpus-specific, which is why it is a measurement and not a rule. The shiny embedding model is last: swapping a good embedder for a slightly better one is usually a couple of points.`,consolidation:`Most people rank (a) first, because it is the change that feels like an upgrade — a bigger model, a better number on a leaderboard. The three that beat it all work by *changing what you put in the index* rather than by changing the machine that reads it. That is the shape of nearly every retrieval win, and it is why this phase’s objective 3 is to build the offline gate first: the ranking above came from someone else’s corpus, and the only version of it that should govern your system is the one you measured on yours.`},{kind:`list`,items:[`**Contextual retrieval — big payoff.** Before embedding each chunk, have a cheap model prepend one sentence of “where this came from.” Anthropic measured retrieval failures dropping ~49% (67% with reranking). It’s a parallel batch job — run it free on a local model overnight.`,`**Small-to-big — big payoff, tiny effort.** Search over small chunks, but hand the model the larger parent section. Precision finds it; context explains it.`,`**Query rewriting / multi-query — decent.** Let a model rephrase the question a few ways and merge results.`,`**HyDE — situational.** Embed a **hypothetical answer** instead of the question. Shines on jargon-heavy corpora, costs latency.`,`**GraphRAG — only when asked.** Knowledge graphs answer “themes across everything” questions; for ordinary doc Q&A they’re an expensive detour.`]},{kind:`code`,title:`Contextual retrieval: one cheap sentence, big payoff`,code:`def contextualize(doc: str, chunk: str) -> str:
    # a local model adds "where this came from" before you embed the chunk
    blurb = complete(
        f"In one sentence, situate this chunk in the document for search.\\n\\n"
        f"<doc>{doc[:4000]}</doc>\\n<chunk>{chunk}</chunk>",
        provider="local",            # free, overnight, embarrassingly parallel
    )
    return f"{blurb}\\n{chunk}"      # embed THIS, not the bare chunk`}]},{id:`p2-c2b`,title:`The modern retrieval stack (what you actually import)`,tag:`libraries, not algorithms`,teaches:[`p2-o1`],blocks:[{kind:`p`,text:`You will never implement BM25 or cosine similarity at work — every layer below is a maintained package. Knowing **which tool does which job** is the skill. This is the whole map, and the exercises use exactly these imports.`},{kind:`table`,headers:[`Layer`,`Its job`,`What you import`],rows:[[`Keyword / sparse`,`exact IDs, codes, rare jargon`,"`rank_bm25` (3-line baseline) or `fastembed` SparseTextEmbedding('Qdrant/bm25')"],[`Dense / semantic`,`meaning, paraphrase`,"`fastembed` TextEmbedding('BAAI/bge-small-en-v1.5') — local ONNX, no API key"],[`Store + fusion`,`holds both vectors, fuses the ranks`,"`qdrant-client` — two Prefetch arms + FusionQuery(Fusion.RRF)"],[`Rerank`,`precision on the final handful`,"`fastembed` TextCrossEncoder('BAAI/bge-reranker-base')"],[`Chunking`,`split without butchering sentences`,"`langchain-text-splitters` RecursiveCharacterTextSplitter"],[`Eval`,`the merge gate`,"`ragas` (LLM judge) + `rapidfuzz` for a fast offline gate"]]},{kind:`callout`,tone:`tip`,title:`Qdrant with zero infrastructure`,text:'`QdrantClient(":memory:")` runs the real client and the real API — fusion included — with no Docker and no network. Point it at `QdrantClient(url=...)` in production and **nothing else in your code changes**. That is exactly why you learn the client, not the algorithm.'},{kind:`code`,title:`Hybrid search end to end — the code you actually write`,code:`from fastembed import TextEmbedding, SparseTextEmbedding
from qdrant_client import QdrantClient, models

dense_model  = TextEmbedding("BAAI/bge-small-en-v1.5")   # meaning
sparse_model = SparseTextEmbedding("Qdrant/bm25")        # exact tokens
client = QdrantClient(":memory:")        # same API as a deployed server

client.create_collection("docs",
    vectors_config={"dense": models.VectorParams(size=384,
                    distance=models.Distance.COSINE)},
    sparse_vectors_config={"kw": models.SparseVectorParams()})

# index: every doc carries BOTH vectors
client.upsert("docs", points=[
    models.PointStruct(id=i, payload={"text": d},
        vector={"dense": dv.tolist(),
                "kw": models.SparseVector(indices=sv.indices.tolist(),
                                          values=sv.values.tolist())})
    for i, (d, dv, sv) in enumerate(zip(docs,
        dense_model.embed(docs), sparse_model.embed(docs)))])

# search: ONE call, two arms, fused server-side by RRF
hits = client.query_points("docs",
    prefetch=[models.Prefetch(query=dq, using="dense", limit=20),
              models.Prefetch(query=sq, using="kw",    limit=20)],
    query=models.FusionQuery(fusion=models.Fusion.RRF),   # <- the fusion
    limit=5, with_payload=True).points`},{kind:`code`,title:`Rerank the candidates (precision step)`,code:`from fastembed.rerank.cross_encoder import TextCrossEncoder

reranker = TextCrossEncoder(model_name="BAAI/bge-reranker-base")
scores = list(reranker.rerank(query, candidates))       # cross-encoder scores
top5 = [c for c, _ in sorted(zip(candidates, scores),
                             key=lambda x: x[1], reverse=True)[:5]]

# Retrieve wide (recall), rerank narrow (precision). 20 -> 5 is the usual shape.`},{kind:`callout`,tone:`fix`,title:`RRF: understand it, don't write it`,text:"Reciprocal Rank Fusion scores each document as the sum of 1/(k+rank) across every ranked list it appears in (k≈60). That is all it is — worth understanding so you can reason about it. But you pass `Fusion.RRF` and the database does it. Hand-rolling fusion is how you get subtle ranking bugs nobody reviews."}]},{id:`p2-c3`,title:`Chunking, minus the folklore`,teaches:[`p2-o2`],blocks:[{kind:`p`,text:`Everyone has a chunking opinion; few have data. Published results are genuinely mixed — fixed ~200-word chunks tie or beat fancy semantic chunking in several studies, while one clinical-domain paper found topic-aware splitting much better. The honest takeaway:`},{kind:`callout`,tone:`tip`,title:`Boring default, measured upgrades`,text:`Start at ~512 tokens with 10–20% overlap. Split on document structure (headings) when there is structure. Adopt anything fancier **only after your eval scores say it helps on your data**.`},{kind:`code`,title:`The boring default: ~512 tokens, ~15% overlap`,code:`def chunk(text: str, size: int = 512, overlap: int = 75) -> list[str]:
    words, out, i = text.split(), [], 0
    step = size - overlap                    # overlap keeps facts from splitting
    while i < len(words):
        out.append(" ".join(words[i : i + size]))
        i += step
    return out

# Prefer splitting on real structure (headings) when the document has it;
# reach for semantic chunking ONLY if your eval scores say it earns its keep.`}]},{id:`p2-c4`,title:`Enough scorekeeping to tune with`,tag:`the number you tune against`,teaches:[`p2-o3`],blocks:[{kind:`p`,text:`You cannot tune retrieval without a number, so here is the minimum: two measurements that split every RAG failure in half. **Faithfulness** asks whether the answer is supported by what was retrieved — it catches hallucination, and it blames the *writer*. **Context recall** asks whether retrieval found the needed information at all, and blames the *librarian*. Which one moved tells you which half to open first.`},{kind:`callout`,tone:`tip`,title:`Fast and lexical here; judged and calibrated in Phase 3`,text:"For this phase you need a gate that runs in seconds: a small set of golden questions, sliced by type, scored with deterministic string metrics (`rapidfuzz`). Deliberately crude — it catches “retrieval broke” instantly and costs nothing. **Phase 3 is where scorekeeping becomes a discipline**: real judges, calibration against your own labels, and a merge gate you can defend. Never report a lexical proxy as “faithfulness.”"},{kind:`code`,title:`The fast gate you tune against in this phase`,code:`from rapidfuzz import fuzz

def recall_nonllm(contexts: list[str], ground_truth: str) -> float:
    """Did retrieval surface the text the answer needs? Lexical, deterministic, free."""
    return max((fuzz.partial_ratio(ground_truth, c) for c in contexts), default=0.0) / 100

# Slice it, or an average will hide the failure that matters:
#   semantic    -> embeddings / chunking
#   exact       -> the keyword arm
#   unanswerable-> the abstain path
# Re-run this after EVERY retrieval change. Tuning by vibes is how you make it
# worse with confidence.`}]},{id:`p2-c5`,title:`The fix-it playbook`,tag:`interview gold`,teaches:[`p2-o4`],blocks:[{kind:`p`,text:`Interviewers don’t ask you to **describe** RAG anymore — they hand you a broken one. Work **backwards from the bad answer** and the failing stage reveals itself:`},{kind:`flow`,title:`Walk it back-to-front`,nodes:[{label:`Answer ignores its context?`,sub:`writer problem: prompt, temperature, weak model`},{label:`Right doc missing from top-k?`,sub:`is it even indexed? → ingestion bug`},{label:`Indexed but ranked low?`,sub:`add keywords/hybrid, fix chunking, check embedding mismatch`},{label:`Retrieved but buried?`,sub:`precision problem → add a reranker`}]},{kind:`list`,items:[`Sanity check #1: can you fetch the known-good doc by ID at all?`,`Sanity check #2: are queries and documents embedded with **the same model**? (The classic silent killer.)`,`Exact-string queries failing → you need keywords in the mix.`,`Right chunk present but ignored → it’s drowning mid-context; rerank and trim.`,`**Re-run the eval after every change. Tuning by vibes is how you make it worse with confidence.**`]},{kind:`code`,title:`The two-minute sanity check`,code:`# 1. can you even fetch the known-good doc by ID?
assert store.get("doc-114") is not None, "ingestion bug - it's not indexed"

# 2. the classic silent killer: SAME embedding model for docs and queries?
assert doc_embedder.name == query_embedder.name, "mismatch -> recall craters"

# only after those pass do you tune chunking / hybrid / reranking -
# and re-run the eval after EVERY change, never by vibes.`}]}],example:{title:`Field story: the vanishing statute`,text:`A legal-tech team’s search nailed “cases about workplace retaliation” but couldn’t find the one case citing statute 18.2-57 — the embedding had shredded the number into noise. One afternoon adding a keyword index and fusing rankings, and recall on their exact-match test slice jumped from 0.41 to 0.93. The eval harness is what let them **see** the jump — and put it on a slide.`},exercises:[{id:`p2-e1`,title:`The two-tier harness (build this one first)`,repo:`phase2-retrieval/01-eval-harness`,rung:`faded`,task:`Write a 30-question golden set over your corpus — 15 meaning-based, 10 exact-match/jargon, 5 unanswerable (those test your “I don’t know” path). Score it two ways: a deterministic lexical tier that runs on every push, and an opt-in judged tier for the nightly run. Wrap tier 1 in pytest so a regression blocks the merge.`,assesses:[`p2-o3`],solution:["Name the lexical metrics `*_nonllm` on purpose — they measure string similarity, not faithfulness. Honest naming now saves an embarrassing slide later.",`Keep the heavy judged tier in an optional dependency group. A fast gate that can be broken by someone else’s transitive dependency is not a fast gate.`,`Reward correct abstention on the unanswerable five — never penalize an honest “not in the docs.”`,`Slice the results. “Recall 0.71” is useless; “recall 0.94 semantic / 0.32 exact” tells you to go add the keyword arm.`],code:`# src/harness.py — tier 1: deterministic, offline, runs on every push
from rapidfuzz import fuzz

def score_row(row, answer: str, contexts: list[str]) -> dict:
    if row["slice"] == "unanswerable":              # the abstain path, judge-free
        return {"abstained": float(is_abstention(answer))}
    return {
        "answer_similarity_nonllm": fuzz.token_set_ratio(row["ground_truth"],
                                                         answer) / 100,
        "context_recall_nonllm": max(
            (fuzz.partial_ratio(row["ground_truth"], c) for c in contexts),
            default=0.0) / 100,
    }

def run(golden, pipeline) -> dict:
    rows = [{**r, **score_row(r, *pipeline(r["question"]))} for r in golden]
    return {"overall": mean_of(rows), "by_slice": grouped_means(rows)}

# tests/test_quality.py — the gate that blocks the merge (no model, no network)
def test_lexical_bars():
    s = run(load_golden("evals/golden.jsonl"), rag_pipeline)
    assert s["by_slice"]["exact"]["context_recall_nonllm"] >= 0.80
    assert s["by_slice"]["unanswerable"]["abstained"] == 1.0

# Tier 2 (real judges, calibration, per-slice gating) is Phase 3's whole job.`},{id:`p2-e2`,title:`Hybrid + rerank, with receipts`,repo:`phase2-retrieval/02-hybrid-rerank`,rung:`faded`,task:`Add keyword search and a reranker to your Phase-1 pipeline. Measure context recall before and after with the harness — especially on the exact-match slice.`,assesses:[`p2-o1`],needs:[`p1-o3`],solution:[`Fetch top-20 hybrid → rerank to top-5 → generate. Recall should jump on exact-match queries.`,`Track token cost too — reranking usually **saves** money by sending fewer, better chunks downstream.`],code:`# 1) index with BOTH vectors, 2) fuse, 3) rerank, 4) MEASURE.
from fastembed import TextEmbedding, SparseTextEmbedding
from fastembed.rerank.cross_encoder import TextCrossEncoder
from qdrant_client import QdrantClient, models

dense_model, sparse_model = (TextEmbedding("BAAI/bge-small-en-v1.5"),
                             SparseTextEmbedding("Qdrant/bm25"))
reranker = TextCrossEncoder(model_name="BAAI/bge-reranker-base")

def hybrid(query, k=20):
    dq = next(iter(dense_model.query_embed(query))).tolist()
    sv = next(iter(sparse_model.query_embed(query)))
    sq = models.SparseVector(indices=sv.indices.tolist(), values=sv.values.tolist())
    pts = client.query_points("docs",
        prefetch=[models.Prefetch(query=dq, using="dense", limit=k),
                  models.Prefetch(query=sq, using="kw",    limit=k)],
        query=models.FusionQuery(fusion=models.Fusion.RRF),
        limit=k, with_payload=True).points
    return [p.payload["text"] for p in pts]

def hybrid_then_rerank(query, k=5):
    cands = hybrid(query, k=20)                      # wide: recall
    scores = list(reranker.rerank(query, cands))     # narrow: precision
    return [c for c, _ in sorted(zip(cands, scores),
                                 key=lambda x: x[1], reverse=True)[:k]]

# 4) the receipts: run your lesson-2.1 harness on each pipeline and diff,
#    sliced by question type. The exact-match slice is where hybrid pays off.
for name, fn in [("dense only", dense_only), ("hybrid", hybrid),
                 ("hybrid+rerank", hybrid_then_rerank)]:
    rows = build_dataset(load_golden("evals/golden.jsonl"),
                         lambda q: (generate(q, fn(q)), fn(q)))
    print(name, evaluate_nonllm(rows))`},{id:`p2-e3`,title:`Sabotage Saturday`,repo:`phase2-retrieval/03-break-and-fix`,rung:`faded`,task:`Plant one bug in a working pipeline (mismatched embedding models, giant chunks, zero overlap) — or use the pre-bugged one in the repo — then hunt it with the playbook. Name which metric moved and why.`,assesses:[`p2-o2`,`p2-o4`],needs:[`p1-o3`],solution:[`Mismatched embeddings crater **context recall**. Bloated chunks dent **precision**. A lazy prompt shows up in **faithfulness**.`,`That bug→metric mapping, said out loud, is a strong interview answer all by itself.`],code:`# The bug is almost never where the symptom is. Work back-to-front.
# Symptom: nonsense retrieval, nothing crashed, context_recall cratered.

# The #1 real-world cause: the index and the query used DIFFERENT embedders.
# Same vector size => no exception => silent garbage.
class RAG:
    def __init__(self, docs, embed):
        self.embed = embed                      # ONE embedder, stored once
        self.client = QdrantClient(":memory:")
        self.client.create_collection("docs",
            vectors_config=models.VectorParams(size=384,
                distance=models.Distance.COSINE))
        self.client.upsert("docs", points=[
            models.PointStruct(id=i, vector=self.embed(d), payload={"text": d})
            for i, d in enumerate(docs)])

    def retrieve(self, query, k=3):
        qv = self.embed(query)                  # <- the SAME embedder. Always.
        pts = self.client.query_points("docs", query=qv, limit=k,
                                       with_payload=True).points
        return [p.payload["text"] for p in pts]

# The regression guard that would have caught it originally:
def test_mixing_embedders_breaks_retrieval():
    rag = RAG(DOCS, embed=model_a)
    good = rag.retrieve("when was the invoice paid?")
    rag.embed = model_b                          # simulate the drift
    assert good != rag.retrieve("when was the invoice paid?")

# In production also record the model name on the collection and refuse to
# query on mismatch -- then re-embed the corpus when you change models.`},{id:`p2-e4`,title:`Contextual chunks, free of charge`,repo:`phase2-retrieval/04-contextual-chunks`,rung:`faded`,task:`Implement chunk contextualization using a local model as the batch worker (it’s free). Compare retrieval failure rate against the naive version on your golden set.`,assesses:[`p2-o2`],needs:[`p1-o1`],solution:[`Prompt: “In one sentence, situate this chunk within the document” → prepend to the chunk → re-embed.`,`It’s embarrassingly parallel; an overnight Ollama run costs exactly nothing.`],code:`from langchain_text_splitters import RecursiveCharacterTextSplitter
from openai import OpenAI

# split with the library everyone uses (respects paragraph/sentence bounds)
splitter = RecursiveCharacterTextSplitter(chunk_size=512, chunk_overlap=75,
    separators=["

", "
", ". ", " ", ""])
chunks = splitter.split_text(doc)

# the batch worker is a FREE local model -- this is why the trick is cheap
ollama = OpenAI(base_url="http://localhost:11434/v1", api_key="ollama")

PROMPT = ("In one short sentence, situate this chunk within the document so it "
          "can be found by search. Reply with the sentence only.
"
          "<document>
{doc}
</document>
<chunk>
{chunk}
</chunk>")

def contextualize(doc, chunk):
    r = ollama.chat.completions.create(model="qwen3.5:8b", temperature=0,
        messages=[{"role": "user",
                   "content": PROMPT.format(doc=doc[:4000], chunk=chunk)}])
    return r.choices[0].message.content.strip() + "
" + chunk   # embed THIS

contextual = [contextualize(doc, c) for c in chunks]   # embarrassingly parallel

# Then prove it: index both variants and compare context_recall on the SAME
# golden set. Anthropic measured ~49% fewer retrieval failures from this alone.`},{id:`p2-e5`,title:`Blank editor: the 20-minute triage, on someone else’s corpus`,rung:`independent`,task:`Empty directory. Take a corpus you have never indexed — your own notes, a downloaded standards document, a repo’s docs folder — and in one sitting write a script that answers, in order: is the known-good document indexed at all, are queries and documents embedded by the same model, does the right chunk make top-20, and does it make top-5. Ten questions is enough. Then write three sentences naming which stage is worst and what you would change first. No harness from exercise 1 to start from — the point is that you can build the diagnostic, not run it.`,assesses:[`p2-o3`,`p2-o4`],needs:[`p1-o3`],solution:[`Your script reports per-stage numbers, not one score. A single “accuracy: 0.6” cannot tell you whether to fix ingestion or add a reranker, and producing it is the mistake this task exists to catch.`,`You checked embedder identity before tuning anything. Everyone agrees this is the first check and almost nobody writes it down; a script that asserts it is the difference between knowing the playbook and having it.`,`The unanswerable questions are in there, and abstention counts as correct. If your ten questions all have answers, you have built a harness that rewards confident nonsense.`,`Your three sentences name a stage and a change, in that order. “Retrieval is bad, I’ll try a better embedding model” is the vibes-tuning this phase spent four exercises arguing against; “the exact-match slice recalls 0.3 while semantic recalls 0.9, so the keyword arm is missing” is the answer that gets you hired.`,"It runs on a corpus with no golden set waiting for it. That is the actual job — the tidy `evals/golden.jsonl` in the companion repo was a scaffold, and this is the first time you have had to invent the questions too."]}],checkpoint:[{id:`p2-q1`,q:`Why does pure vector search miss exact identifiers, and what’s the fix?`,a:`Tokenizers shred IDs and codes into sub-tokens with no stable meaning, so there’s no clean vector neighborhood. Fix: keyword search (BM25) fused with dense results, then a reranker for precision.`},{id:`p2-q2`,q:`You can only afford two metrics. Which, and what does each blame?`,a:`Faithfulness (blames the writer — catches hallucination) and context recall (blames the librarian — did retrieval find it). Together they split every failure into “generation” or “retrieval,” which is debugging question #1.`},{id:`p2-q3`,q:`Your overall recall is 0.71 and you have one afternoon. What do you look at?`,a:`The per-slice breakdown, not the average. Recall that is strong on paraphrase questions and terrible on identifier questions is a missing keyword arm — a couple of hours of wiring. A uniform 0.71 across every slice is a different bug entirely (chunking, or an embedding mismatch between index and query). Averages hide the cheap fix.`},{id:`p2-q4`,q:`Make the case for and against GraphRAG in one breath.`,a:`For: multi-hop and corpus-wide questions (“trends across all filings”) that chunk retrieval structurally can’t answer. Against: heavy build/run cost when hybrid + rerank + contextual chunks already pass your eval bar for ordinary Q&A.`}],workshop:{id:`w1`,title:`Workshop · Ship a real RAG service`,subtitle:`Everything from Phases 1–2, wired into one running system you can curl.`,repo:`workshops/assistant`,assesses:[`p2-o1`,`p2-o2`,`p2-o3`,`p2-o4`],needs:[`p1-o1`,`p1-o2`,`p1-o3`],blocks:[{kind:`p`,text:`Time to stop reading and build. This is the first checkpoint where the pieces become a **system**: a small FastAPI service that ingests a real corpus, retrieves with hybrid + rerank, answers with citations, refuses when it should, and proves its own quality with an eval gate. Nothing here is new — it is Phases 1 and 2 assembled and made to run.`},{kind:`p`,text:"The `before/` folder is a skeleton with `TODO`s and passing-but-empty tests; `after/` is the finished reference. Resist opening `after/` until your own version is stuck."},{kind:`callout`,tone:`tip`,title:`Why Qdrant for this build`,text:"We use **Qdrant** as the vector store: one `docker run` to start, and it does **native hybrid search** (dense + sparse in one query) so the Phase-2 lesson stays first-class instead of bolted on. Everything you write stays behind your own `Store` interface, so swapping in pgvector later is a two-function change — exactly the adapter habit from Phase 1."},{kind:`code`,title:`The whole stack comes up with one command`,code:`# docker-compose.yml — Qdrant + the service, zero cloud accounts
services:
  qdrant:

    ports: ["6333:6333"]
