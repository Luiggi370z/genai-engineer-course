turned a critical exploit into a blocked click.`},exercises:[{id:`p4-e1`,title:`The 45-minute mock`,repo:`phase6-design-defend/WORKSHEET.md`,rung:`faded`,task:`"Design a RAG system over 10M enterprise docs, p95 < 2s, multi-tenant, handling untrusted documents." Diagram + 8-step narrative, out loud, timed. Record yourself.`,assesses:[`p4-o1`,`p4-o2`],needs:[`p2-o1`,`p-evals-o5`],solution:[`Open with 4+ clarifying questions (QPS, freshness, tenancy, residency, threat model).`,`Draw the ingestion/serving split first, then walk steps 3–8 — the worked design above is your model answer, and remember to guard the ingestion side.`]},{id:`p4-e2`,title:`Attack your own Phase-4 assistant`,repo:`phase6-design-defend/01-red-team`,rung:`faded`,task:`Write one working example of each major attack family from the catalog against your Workshop-4 assistant: a direct injection, an indirect one (hide instructions in an email/news page it reads), a payload split, and an encoded payload. Log which ones land.`,assesses:[`p4-o3`],needs:[`p3-o2`],solution:[`The indirect one via a page/email it fetches is the eye-opener — that’s the realistic threat, and most unhardened agents fall for it.`,`Keep every attack in evals/redteam.jsonl; it becomes your CI gate in the workshop below.`]},{id:`p4-e3`,title:`Cost model on real numbers`,repo:`phase6-design-defend/02-cost-model`,rung:`faded`,task:`Estimate $/query for 100K queries/day using the Phase-1 usage-based cost function. Show how a cache hit rate and a local routing tier change the bill.`,assesses:[`p4-o2`],needs:[`p1-o2`],solution:[`Lever order: cache → route → compress. Apply the cache hit rate first, then routing.`,`A 40% cache hit + local triage tier typically halves the bill — chart it.`]},{id:`p4-e4`,title:`Blank editor: a cold design, on a timer, out loud`,rung:`independent`,task:`Blank page, 25 minutes, timer running, recording yourself. Pick a prompt you have not seen before — “design a support-ticket triage system for 50k tickets a day”, “design a code-review assistant for a monorepo”, “design a compliance-document Q&A tool for a bank” — and design it out loud, start to finish, without the 8-step list in front of you. Then stop the timer and listen back once. No script on screen: if the eight steps only exist as a page you can consult, you do not have them yet.`,assesses:[`p4-o1`,`p4-o2`,`p4-o3`],needs:[`p-evals-o5`],solution:[`You opened with clarifying questions and did not draw anything for the first two minutes. A candidate who starts sketching boxes before asking about load, freshness, tenancy and threat model has answered a question nobody asked.`,`You produced actual numbers for latency and cost, decomposed rather than guessed — retrieval, rerank, generation, each with a figure you can defend. “It should be fast enough” is the answer that ends interviews.`,`You said how it is evaluated and how it is observed, unprompted. These are steps 7 and 8 and they are where most people trail off, which is exactly why they are the steps that distinguish you.`,`You named the threat model for *this* system specifically — what untrusted text reaches the model, and what the agent could do with a bypass — rather than reciting the attack catalog.`,`Listening back, you can hear the one step you skipped. Everybody skips one under time pressure, and the recording is the only way to find out which is yours. Note it and run the drill again next week on a fresh prompt.`,`It was uncomfortable. It is supposed to be — the room will be too, and this is the cheapest place to find out which parts of the script you only recognise rather than know.`]}],workshop:{id:`w3`,title:`Workshop · Harden the assistant`,subtitle:`Take your Phase-4 personal assistant and armor it against the full attack catalog.`,repo:`workshops/assistant`,assesses:[`p4-o3`,`p4-o4`],needs:[`p3-o2`,`p3-o3`],blocks:[{kind:`p`,text:`Your Workshop-4 assistant is useful but naïve — it reads email and web pages, which means it reads whatever an attacker plants there. In this workshop you wrap it in the 3-layer guardrail pipeline, apply spotlighting to everything it reads, lock its tools to least privilege, keep HITL on every irreversible action, and prove it all with a red-team suite that runs in CI.`},{kind:`callout`,tone:`warn`,title:`The bar is containment, not perfection`,text:`You will NOT achieve zero successful injections — nobody does in 2026, and a workshop that claimed to would be lying. The real bar: when an injection lands, it can’t do damage. A poisoned email can make the summary weird; it must never make the assistant send money, forward mail, or delete anything without a human clicking approve.`},{kind:`flow`,title:`From naïve to hardened`,nodes:[{label:`before/`,sub:`Workshop-4 assistant, unguarded`},{label:`+ L1 + spotlight`,sub:`on every input AND fetched page/email`},{label:`+ L2 guard model`,sub:`local llama-guard3`},{label:`+ least privilege`,sub:`scope every tool`},{label:`+ red-team CI`,sub:`after/ — gated`}]},{kind:`code`,title:`The test that must pass (after/tests/test_redteam.py)`,code:`def test_no_redteam_bypass():
    for case in load_jsonl("evals/redteam.jsonl"):
        result = assistant.run(case["input"])
        # a landed injection is allowed to produce junk text;
        # it is NEVER allowed to trigger a gated action without approval
        assert not result.fired_irreversible_tool_without_approval
        assert not result.leaked_pii
    # direct/obvious injections should be caught outright
    assert bypass_rate(category="direct") == 0.0`}],deliverables:[{id:`w3-d1`,text:`Every input AND every fetched email/news page passes through **L1 (decode+scan+redact)** before the model sees it`},{id:`w3-d2`,text:`All untrusted content is **spotlighted** ("this is data, not instructions") in the prompt`},{id:`w3-d3`,text:`A local **guard model (L2)** screens inputs; an **output gate (L3)** scans for PII and groundedness`},{id:`w3-d4`,text:`Tools are **least-privilege** and every irreversible action still requires **HITL approval**`},{id:`w3-d5`,text:"A `redteam.jsonl` covering all catalog families runs in **CI**; direct injections are caught, and **no landed injection can fire a gated tool**"}],stretch:[`Add the dual-LLM pattern: a quarantined model (no tools) summarizes untrusted pages, a privileged model plans actions.`,`Run NVIDIA garak against the assistant and add any new bypasses it finds to your suite.`,`Add an audit log: every blocked attempt and every approval recorded with a timestamp and reason.`]},checkpoint:[{id:`p4-q1`,q:`Direct vs indirect injection — and which is scarier in 2026?`,a:`Direct: the user types the malicious instruction (they’re attacking themselves — low business risk). Indirect: the malice hides in data the agent reads (email, web page, doc) and the user is the victim. Indirect is the 2026 nightmare because agents now read untrusted content and act with tools.`},{id:`p4-q2`,q:`Why is "just filter out prompt injection" the wrong mental model?`,a:`Because the model reads instructions and data through the same channel, injection is structural, not a patchable bug — adaptive attacks beat published defenses at >90%. The working strategy is containment: assume some land, and ensure a landed injection can’t do damage (least privilege + HITL + output gates).`},{id:`p4-q3`,q:`What is spotlighting and why is it worth doing despite being imperfect?`,a:`Wrapping untrusted text and telling the model explicitly "this is data, never instructions." It’s probabilistic — a clever payload can still work — but it measurably lowers success rates for almost no cost, so it’s baseline hygiene on everything the agent reads.`},{id:`p4-q4`,q:`Which two design steps do candidates skip, and what’s the forgotten security surface?`,a:`Evaluation (4) and observability (5). The forgotten surface is indirect injection via retrieved/ingested documents — so guardrails belong on the ingestion pipeline too, not just on user input.`}],resources:[{label:`OWASP Top 10 for LLM Applications`,url:`https://owasp.org/www-project-top-10-for-large-language-model-applications/`},{label:`Simon Willison — prompt injection archive`,url:`https://simonwillison.net/tags/prompt-injection/`},{label:`CaMeL — defeating prompt injection by design (paper)`,url:`https://arxiv.org/abs/2503.18813`},{label:`NVIDIA garak — LLM vulnerability scanner`,url:`https://github.com/NVIDIA/garak`},{label:`Microsoft PyRIT — red-teaming toolkit`,url:`https://github.com/Azure/PyRIT`},{label:`Llama Guard 3 (Ollama tag llama-guard3:8b)`,url:`https://ollama.com/library/llama-guard3`}]},{id:`p5`,weeks:`Weeks 14–15`,color:`#0891B2`,title:`MCP: The Universal Tool Port`,tagline:`One protocol so any agent can use any tool. Consume existing servers, build your own over a REST API, get the auth right — then plug it into the assistant you built.`,tldr:`MCP is tool-calling with a wire protocol, so any agent can use any tool. You consume an existing server through the five-beat handshake on the stateless 2026 spec, build your own over a REST API with tools, resources and prompts, and pick the auth each deployment needs.`,objectives:[{id:`p5-o1`,text:`**Explain** what MCP is, the problem it solves, and how it sits on top of the tool-calling from Phase 4`},{id:`p5-o2`,text:`**Consume** an existing MCP server from a client — the five beats, on the stateless 2026 protocol`},{id:`p5-o3`,text:"**Build** your own MCP server over a REST API — tools, resources and prompts — with `MCPServer` (SDK v2)"},{id:`p5-o4`,text:`**Choose** the right authentication per deployment — none (stdio), Bearer/API key, or OAuth 2.1 + PKCE — and defend the choice`}],recall:[{id:`p5-r1`,q:`What makes a tool definition good enough for a model to use correctly? Name the parts before you read on.`,a:`A typed schema for the arguments, a docstring that says *when* to reach for this tool and not merely what it does, validation that rejects bad input before it reaches the outside world, and errors returned as data so a failure becomes an observation the agent can react to. The docstring is the interface. That matters doubly here, because an MCP server publishes those descriptions to clients you will never meet — a vague one is now everyone’s problem.`,from:`p3-o2`},{id:`p5-r2`,q:`Cold: what is a “tool” in the Phase 4 sense, and why is a retrieval call one?`,a:`Anything that touches the world outside the model’s context — a database read, an HTTP request, a file write, a search over your corpus. Retrieval is a tool call like any other, which is why the same schema-plus-validation discipline applies. MCP does not replace this idea; it standardises how the definitions travel between processes.`,from:`p3-o1`},{id:`p5-r3`,q:`Untrusted text arrives from a tool your agent just called. Which attack family is that, and what stops it?`,a:`Indirect prompt injection — instructions hidden in retrieved content, a fetched web page, an email body, or a tool’s output. The defenses are layered and the last one is containment rather than filtering: least-privilege tools, no unreviewed outbound actions, an egress allowlist. Keep it in mind for the next 45 minutes, because a third-party MCP server is precisely a tool output you do not control, arriving from code you did not write.`,from:`p4-o3`}],concepts:[{id:`p5-c1`,title:`The problem MCP solves`,tag:`fundamentals`,teaches:[`p5-o1`],blocks:[{kind:`predict`,prompt:`Your company has **4 agents** — a support bot, an internal assistant, a code reviewer, a data analyst — and **6 systems** they each need to reach: Jira, Postgres, the invoice API, Slack, the wiki, and GitHub. Writing hand-rolled tools the Phase 4 way, how many separate integrations does someone have to write and maintain? Now: what is that number if all six speak one protocol? Work both out before reading on.`,answer:`**24 without, 10 with.** Every agent needs its own client code for every system, so 4 × 6 = 24 integrations, each with its own schema drift and its own bugs. With one protocol you write 6 servers and 4 clients: 10 pieces, and the next agent costs 1 rather than 6. That is not a small constant-factor win, it is the difference between multiplication and addition.`,consolidation:`This is the entire argument for MCP, and it is worth having derived it yourself rather than being told it — because the same arithmetic tells you when *not* to bother. One agent and one system is 1 integration either way, and the protocol is pure overhead. The payoff arrives with the second consumer, which is also the moment the second question starts to matter: those 6 servers are now reachable by clients you do not control, so their descriptions, their validation, and their auth are no longer private implementation details.`},{kind:`p`,text:`In Phase 4 you learned that every connection to the outside world is a **tool** — but a tool you write by hand works only in *your* agent, and everyone else rewrites the same invoice lookup for theirs. Before USB-C, every device had its own charger. **MCP (Model Context Protocol)** is USB-C for agent tools: write one server for your invoice system, and Claude, ChatGPT, Cursor and your own agents can all call it, unchanged.`},{kind:`list`,items:[`It’s a real, governed standard: under the Linux Foundation’s Agentic AI Foundation since late 2025, backed by Anthropic, OpenAI, Google, and Microsoft, with ~10,000 public servers.`,`Mental model: MCP sits **on top of** the tool calling from Phase 4. It doesn’t replace your REST API — it wraps capabilities so any client can **discover** them at runtime, over a **standard transport**, in a **session**.`,`The payoff for you: your Phase-4 assistant can pick up a brand-new server with **zero code changes**, because the capability list is data the client fetches, not code you hard-wire.`]},{kind:`callout`,tone:`tip`,title:`Why MCP gets its own phase`,text:`MCP is now table stakes in 2026 GenAI interviews and real jobs — and it has enough moving parts (three primitives, two transports, a session lifecycle, and a genuinely tricky auth story) that cramming it into the agents phase shortchanged it. Here it gets the room it deserves.`}]},{id:`p5-c2`,title:`Host, client, server, and the five-beat handshake`,tag:`how it works`,teaches:[`p5-o1`,`p5-o2`],blocks:[{kind:`p`,text:`The naming trips everyone up, so pin it. The **host** is the app the user touches — Claude Desktop, Cursor, or your own agent. Inside the host runs one **client** per connection, and each client talks to exactly one **server** — your code, exposing capabilities. One host can hold many clients, each wired to a different server. The moment your Phase-4 assistant opens an MCP client, it *is* a host.`},{kind:`flow`,title:`Every client session, same five beats`,nodes:[{label:`Connect`,sub:`open the transport`},{label:`initialize`,sub:`capability handshake`},{label:`list_tools / resources`,sub:`runtime discovery`},{label:`call_tool / read_resource`,sub:`actually use it`},{label:`Close`,sub:`tear down`}]},{kind:`p`,text:`On the wire it’s just **JSON-RPC 2.0** — plain request/response messages. You almost never touch that layer (the SDK does), but knowing it’s there explains the two transports you choose between:`},{kind:`list`,items:[`**stdio** — the client launches your server as a child process and talks over its stdin/stdout. No network, nothing to deploy, no auth needed (OS user isolation). Where you start, and what desktop apps use.`,`**Streamable HTTP** — your server is a web service at a URL; remote clients connect over HTTP. This is how you share a server with a team — and where authentication becomes mandatory.`,`**In-memory** — v2 lets a client take the server *object* directly, with no transport at all. That is how you test: real protocol messages, no network, no subprocess.`]},{kind:`callout`,tone:`fix`,title:`2026: the beats stayed, the session went away`,text:`The 2026-07-28 spec moved MCP from a **stateful, bidirectional** protocol to **stateless request/response**. In the old world a client opened a long-lived session and held it open. Now that is a compatibility path only. The five beats still describe exactly what a client *does* — they simply no longer have to happen inside one held-open connection. Practical upshot: never assume the server remembers you between calls.`},{kind:`code`,title:`Consuming a server — the five beats in code`,code:`from mcp import Client            # v2: one client for every transport

# Client takes an in-memory server object, a URL, or a transport --
# the SAME code works for all three. That is the protocol doing its job.
async with Client("http://localhost:8000/mcp") as client:   # 1. connect
                                                            # 2. initialize (automatic)
    tools = await client.list_tools()                       # 3. discover
    out = await client.call_tool("lookup_invoice",          # 4. call
                                 {"invoice_id": "INV-88231"})
    print(out.content[0].text, out.is_error)   # v2 fields are snake_case
                                                            # 5. close (context exit)

# In tests, skip the network entirely -- pass the server object itself:
#     async with Client(build_server()) as client: ...`},{kind:`callout`,tone:`tip`,title:`Discovery is the whole point`,text:`With a REST API the caller must already know every endpoint. With MCP the client asks the server at runtime "what can you do?" and gets back tool names, descriptions, and JSON schemas. That’s why one agent can adopt a new server with no code change — capabilities are data, not code.`}]},{id:`p5-c3`,title:`Building a server: three primitives, one decorator each`,tag:`MCPServer · SDK v2`,teaches:[`p5-o3`],blocks:[{kind:`p`,text:'You will basically never write JSON-RPC by hand. **`MCPServer`** turns a normal Python function into an MCP primitive with a decorator and generates the JSON Schema from your type hints — the exact same "docstring is the interface" skill from Phase 4, now exposed to the whole ecosystem.'},{kind:`callout`,tone:`warn`,title:`Two different projects are called FastMCP — know which one a tutorial means`,text:"**FastMCP 1.0** was contributed into the official `mcp` package in 2024. SDK **v2 (2026-07-28) renamed that class to `MCPServer`** and *removed* the old `mcp.server.fastmcp` path — removed, not deprecated, so v1 code fails on import. Separately, **standalone FastMCP** (Jeremiah Lowin, now PrefectHQ) is a different project that reached **3.0 GA in February 2026** and has its own roadmap (`pip install fastmcp`). Same name, two projects, actively diverging. This course uses the **official SDK**."},{kind:`code`,title:`A server with all three primitives`,code:`from mcp.server import MCPServer      # v2 (v1's FastMCP path was removed)

mcp = MCPServer("invoices")

@mcp.tool()
def lookup_invoice(invoice_id: str) -> dict:
    """Fetch an invoice by ID. Use when the user asks about a specific invoice."""
    return api.get(f"/invoices/{invoice_id}")   # wraps your existing REST endpoint

@mcp.resource("invoices://recent")
def recent() -> str:
    """Read-only: the 10 most recent invoices, for context."""
    return format(api.get("/invoices?limit=10"))

@mcp.prompt()
def dispute(invoice_id: str) -> str:
    """A reusable template for drafting a dispute about an invoice."""
    return f"Draft a polite dispute for invoice {invoice_id}. Be specific."

if __name__ == "__main__":
    mcp.run()                      # stdio; or transport="streamable-http"

# You never write JSON Schema -- the SDK derives it from your type hints, and the
# docstring becomes the description the model reads when choosing a tool.`},{kind:`list`,items:[`**@mcp.tool()** — an action (like POST). Name + docstring + type hints = the schema the model sees. Write the docstring like a prompt.`,`**@mcp.resource("scheme://path")** — read-only data (like GET) the client pulls into context on demand.`,`**@mcp.prompt()** — a reusable prompt template the host can offer the user by name.`]},{kind:`callout`,tone:`tip`,title:`Inspector before agent, always`,text:'Run `npx @modelcontextprotocol/inspector uv run python -m src.server` — a browser UI that lists your tools and lets you call them by hand. Get it green there BEFORE any agent connects. That cleanly separates "my server is broken" from "my agent is broken," and it will save you hours.'}]},{id:`p5-c4`,title:`Authentication: pick the right door`,tag:`the tricky part`,teaches:[`p5-o4`],blocks:[{kind:`p`,text:`Auth is where most MCP projects stumble, and it’s a favorite interview probe. The rule is simple: **the right method depends on the transport and the trust boundary.** Applying one method everywhere is the pattern teams regret.`},{kind:`table`,headers:[`Method`,`Use when`,`Watch out for`],rows:[[`None (env vars)`,`Local stdio server — only your OS user can reach it; upstream secrets come from the environment.`,`Never hard-code keys; pull from env. This is correct, not lazy, for local.`],[`Bearer token / API key`,`Internal or team remote server behind a gateway; every client is a known app.`,"Plaintext-in-config leaks; use ${env:VAR} references, HTTPS only, never in query strings."],[`OAuth 2.1 + PKCE`,`Any public-facing remote server, or one acting on behalf of users who must consent.`,`Mandatory per the Nov-2025 spec for public servers. Validate token audience; never pass tokens through.`]]},{kind:`list`,items:[`**OAuth 2.1 separates the token issuer from your server.** Your MCP server is a *resource server*: it accepts a short-lived, scoped Bearer token, validates signature + expiry + **audience**, then serves the request. Auth stays out of the protocol itself.`,`**PKCE (S256) is non-negotiable** for public servers — the spec bans the implicit grant and plain PKCE. All endpoints HTTPS; Bearer tokens never in URLs.`,`**The confused-deputy trap:** never forward a client’s token to an upstream API. If your server needs to call GitHub on the user’s behalf, it obtains its *own* separate token. Token passthrough is explicitly forbidden.`,`**The 2026 reality check:** an audit found ~25% of public MCP servers had *no* auth and ~53% relied on long-lived static keys. Getting this right is a real differentiator.`]},{kind:`callout`,tone:`warn`,title:`Tool poisoning is an MCP-specific attack`,text:`Remember the Phase-6 attack catalog: because a client reads tool **descriptions** at discovery, a malicious server can hide instructions in a tool’s name or description, and a compromised tool can return adversarial content as "trusted" tool output. Vet the servers you connect to, treat tool output as untrusted, and allow-list tools — auth protects your server; skepticism protects your client.`}]}],example:{title:`Field story: one server, every assistant`,text:`A fintech team wrapped their internal invoicing API in a single MCP server — three tools, a recent-invoices resource, OAuth 2.1 for the remote deployment. Within a month it was being used unchanged by their support agents, an internal Cursor workflow for the finance team, and a customer-facing Claude integration. They wrote the tools once; three different hosts discovered and used them with zero coordination. That is the entire promise of a standard, delivered.`},exercises:[{id:`p5-e1`,title:`Be a client first`,repo:`phase7-mcp/01-consume-a-server`,rung:`faded`,task:`Before building anything, connect a Python ClientSession to a prebuilt reference server over stdio. Run the handshake, list its tools and resources, call one. (Needs Node/npx on PATH.)`,assesses:[`p5-o2`],needs:[`p3-o2`],solution:[`The lifecycle never changes: connect → initialize → list → call → close. Internalize that order.`,`Using a server you didn’t write means zero server code to debug — anything that breaks is your client. That’s why we go consumer-first.`]},{id:`p5-e2`,title:`Wrap a REST API as an MCP server`,repo:`phase7-mcp/02-rest-to-mcp`,rung:`faded`,task:`Take a small public REST API (weather, or the provided toy service) and expose it as an MCP server with 3 tools, one resource, and one prompt. Verify everything in the MCP Inspector — no agent yet.`,assesses:[`p5-o3`],needs:[`p3-o2`],solution:[`One tool per meaningful endpoint; docstrings written for the model; validate arguments before calling the API.`,`Green in the Inspector = your protocol layer is correct. That’s the entire goal of this rung.`]},{id:`p5-e3`,title:`Three doors: stdio, Bearer, OAuth`,repo:`phase7-mcp/03-auth-modes`,rung:`faded`,task:`Deploy your server three ways: as a local stdio server (env-var secrets), as a remote HTTP server behind a static Bearer token, and as a remote server with OAuth 2.1 + PKCE. Write down which you’d use for a personal tool, a team tool, and a public SaaS integration.`,assesses:[`p5-o4`],solution:[`stdio → personal; Bearer → internal/team; OAuth 2.1 → public or on-behalf-of-user. Match method to trust boundary.`,`Validate token audience on the OAuth path, and confirm you never forward the client token upstream (obtain your own).`]},{id:`p5-e4`,title:`Blank editor: a server for something you actually use`,rung:`independent`,task:`Empty directory, no template, no copying from exercise 2. Pick a service you personally use that has an API — your note app, a home-automation hub, your bank’s export endpoint, a hobby project — and expose it over MCP from scratch: two tools, one resource, one prompt. Then prove it in the Inspector, and finally connect a client you also write yourself and call one tool end to end. The unfamiliar API is the point: this is the first time nobody has picked a well-behaved one for you.`,assesses:[`p5-o2`,`p5-o3`],needs:[`p3-o2`],solution:[`You wrote the server before the client and verified it in the Inspector first. Debugging two unproven halves at once is the trap, and the consumer-first ordering in exercise 1 existed to teach you exactly this instinct.`,`Your tool docstrings would let a model that has never seen your service choose correctly between your two tools. Read them back as if you were the model: if both descriptions could apply to the same request, the schema is fine and the interface is broken.`,`Arguments are validated in your server before the upstream call, and upstream failures come back as structured errors rather than tracebacks. A 500 from your bank should reach the agent as something it can react to.`,`You picked the auth mode deliberately and can say what trust boundary it matches — and no secret ended up in the tool arguments or the resource body, where a client you do not control would see it.`,`The resource and the prompt are not filler. If you cannot say why that data is a resource rather than a tool call, you have three tools and a habit of following templates.`,`It works against an API that was not designed for this course. Real endpoints paginate oddly, return inconsistent nulls, and rate-limit you — and handling that unassisted is the difference between having followed exercise 2 and being able to do the job.`]}],workshop:{id:`w4`,title:`Workshop · Your own MCP, used by your assistant`,subtitle:`Build an MCP server for a service you care about — then let your Phase-4 assistant consume it as a tool.`,repo:`workshops/assistant`,assesses:[`p5-o2`,`p5-o3`,`p5-o4`],needs:[`p3-o2`],blocks:[{kind:`p`,text:`The payoff workshop: build a real MCP server exposing a service of your choice — your notes, a habit tracker, a home API, anything with a few operations — verify it in the Inspector, secure it appropriately, then wire it into your Workshop-4 assistant so it discovers and calls the server like any other tool.`},{kind:`p`,text:`This is the moment the whole course clicks: the assistant from Phase 4, taught to remember in Phase 5 and hardened in Phase 6, gains new powers through a standard protocol with zero changes to its core loop.`},{kind:`callout`,tone:`tip`,title:`The "zero code change" test`,text:`The win condition isn’t just that your server works — it’s that your assistant picks up its tools by **discovery**, without you hand-coding each one into the agent. Add a new tool to the server, restart, and the assistant can use it immediately. That’s the standard doing its job.`},{kind:`flow`,title:`What connects to what`,nodes:[{label:`Your service`,sub:`notes / tracker / API`},{label:`Your MCP server`,sub:`MCPServer: tools + resource + prompt`},{label:`Auth`,sub:`stdio local, or Bearer/OAuth remote`},{label:`Assistant (Workshop 4)`,sub:`opens a client, discovers tools`},{label:`It just works`,sub:`discovered, not hard-coded`}]},{kind:`code`,title:`The assistant gains your server (before/wire_mcp.py)`,code:`# In your Workshop-4 assistant -- add an MCP client, don't hand-code tools
from mcp import Client

async def load_mcp_tools(target):
    async with Client(target) as client:
        discovered = await client.list_tools()       # <- discovery, not hard-coding
        return [as_agent_tool(t) for t in discovered.tools]   # TODO: adapt

# Now the assistant can call your notes/tracker/home tools alongside email, news,
# telegram and calendar -- all through one uniform interface. Add a tool to the
# server, restart, and the assistant can use it with NO assistant code change.`}],deliverables:[{id:`w4-d1`,text:`An MCP server exposing at least **3 tools, 1 resource, and 1 prompt** over a real service`},{id:`w4-d2`,text:`Verified in the **MCP Inspector** before any agent connects`},{id:`w4-d3`,text:`Secured correctly for its deployment: **env-var secrets (stdio)** or **Bearer/OAuth (remote)** with audience validation`},{id:`w4-d4`,text:`Your **Workshop-4 assistant consumes it via discovery** — tools are listed at runtime, not hard-coded`},{id:`w4-d5`,text:`Adding a new tool to the server makes it usable by the assistant **with no assistant code change**`}],stretch:[`Deploy the server remotely with OAuth 2.1 + PKCE and connect the assistant over Streamable HTTP.`,`Add tool-poisoning defenses on the client side: allow-list which discovered tools the assistant may actually call.`,`Publish the server’s config so a teammate can connect their own client to it.`]},checkpoint:[{id:`p5-q1`,q:`What does MCP add on top of plain tool calling?`,a:`Runtime discovery of tools/resources/prompts, a standard transport and session layer, and write-once-use-everywhere interop. Tool calling is how one agent invokes one function; MCP is how any client discovers and uses any server’s capabilities.`},{id:`p5-q2`,q:`Walk the five beats of a client session.`,a:`Connect (open the transport) → initialize (capability handshake) → list_tools/list_resources (runtime discovery) → call_tool/read_resource (use it) → close (tear down). Every client you ever write repeats exactly this.`},{id:`p5-q3`,q:`Which auth method for a local tool, a team tool, and a public SaaS server — and one trap for each?`,a:`Local stdio → none, env-var secrets (trap: hard-coding keys). Team remote → Bearer/API key over HTTPS (trap: plaintext in config). Public → OAuth 2.1 + PKCE (trap: forwarding the client token upstream — the confused-deputy vulnerability; get your own token).`},{id:`p5-q4`,q:`Why verify a server in the Inspector before connecting an agent?`,a:`It isolates protocol bugs from agent bugs. If the Inspector can list and call your tools, your server is correct — so anything that breaks after wiring the agent is the agent’s fault, not the protocol’s.`}],resources:[{label:`MCP — spec & SDKs`,url:`https://modelcontextprotocol.io`},{label:`MCP — official Python SDK`,url:`https://github.com/modelcontextprotocol/python-sdk`},{label:`MCP Inspector`,url:`https://github.com/modelcontextprotocol/inspector`},{label:`MCP authorization spec (OAuth 2.1)`,url:`https://modelcontextprotocol.io/specification/draft/basic/authorization`},{label:`Standalone FastMCP 3.x (a different project)`,url:`https://gofastmcp.com`},{label:`Simon Willison — MCP security problems`,url:`https://simonwillison.net/2025/Apr/9/mcp-prompt-injection/`}]},{id:`p6`,weeks:`Weeks 16–17`,color:`#E11D48`,title:`Run It in Production`,tagline:`Everything you built has run on your laptop. Now put the assistant and its MCP server on the internet — containerized, CI-gated, observable — and then make it cheaper and faster without making it worse.`,tldr:`The stack leaves your laptop: containerized, CI-gated on tests, evals and the red-team suite, deployed with health checks and a rollback path, traced with OpenTelemetry. Then the optimization ladder — cache, route, stream — defended on P99 rather than an average.`,objectives:[{id:`p6-o1`,text:`**Containerize** the assistant and its MCP server so the whole stack comes up with one command`},{id:`p6-o2`,text:`**Build** a CI pipeline that runs tests, evals and the red-team suite — and blocks merges that regress`},{id:`p6-o3`,text:`**Deploy** to a real host with platform secrets, health checks and a rollback path`},{id:`p6-o4`,text:`**Instrument** cost, latency and quality with OpenTelemetry so the traces outlive whichever vendor you send them to`},{id:`p6-o5`,text:`**Optimize** cost and latency in the order that pays — cache, then route, then stream — and defend a P99 budget rather than an average`}],recall:[{id:`p6-r1`,q:`Which parts of an eval suite need no LLM at all? List as many as you can — this decides what your CI can afford to run on every push.`,a:`Dataset integrity checks, retrieval metrics computed from known document ids, abstention checks, every trajectory metric, aggregation, and the gate logic itself. All deterministic, free, and offline. The judged tier is reserved for what genuinely requires reading meaning, and it runs nightly. That split is the shape of the pipeline you are about to build in objective 2.`,from:`p-evals-o5`},{id:`p6-r2`,q:`Cold: name the four context-window moves in priority order, and say which one a summarizer implements.`,a:`Keep, compress, evict, park. The summarizer is *compress*, and it is the riskiest of the four because it is a lossy write that can launder a guess into an established fact. It comes back here for a production reason: a long-running deployed agent applies these moves thousands of times a day, and a poisoned summary is a bug you can only trace if you kept provenance.`,from:`p-memory-o2`},{id:`p6-r3`,q:`You are asked to justify your guardrails to a security reviewer. What is the argument for why filtering is not enough?`,a:`Filters are probabilistic and attackers iterate, so the design has to survive a bypass rather than assume none. That means containment: least-privilege tools, no unreviewed irreversible actions, an egress allowlist, hard caps in code. In this phase that argument becomes concrete — the red-team suite runs in CI and blocks the merge, which is how a claim about layered defense turns into something a reviewer can verify.`,from:`p4-o4`}],concepts:[{id:`p6-c1`,title:`Containerize the whole stack`,tag:`deployment`,teaches:[`p6-o1`],blocks:[{kind:`p`,text:"A deployment is only real if a stranger can run it. Your target: `docker compose up` brings the assistant, its MCP server, the vector store, and a local model online together — ideally with **zero API keys** for the demo path. Multi-stage Dockerfiles keep images small; compose wires the services."},{kind:`code`,title:`One compose file, the whole system`,code:`services:
  assistant:
    build: ./assistant
    depends_on: [mcp, qdrant, ollama]
    environment: [MCP_URL=http://mcp:8080, QDRANT_URL=http://qdrant:6333]
    ports: ["8000:8000"]
  mcp:                          # your Workshop-7 server
    build: ./mcp-server
    ports: ["8080:8080"]
  qdrant:
    image: qdrant/qdrant:latest
  ollama:                       # local model = no API keys for the demo
    image: ollama/ollama:latest
# reviewers run ONE command and the assistant + MCP + retrieval all come up.`},{kind:`callout`,tone:`tip`,title:`The zero-key demo is a differentiator`,text:`Most portfolio repos die in the reviewer’s first minute — missing keys, broken setup. A stack that boots fully on local models from one command proves the system actually runs and respects the reviewer’s ten minutes. Keep a hosted-model path too, behind an env flag, for the quality-critical version.`}]},{id:`p6-c2`,title:`CI that gates on quality and safety`,tag:`CI/CD`,teaches:[`p6-o2`],blocks:[{kind:`p`,text:`Your Phases 3 and 6 gave you two suites that now become merge gates: the **RAGAS eval** (quality) and the **red-team suite** (safety). CI runs them on every pull request; a regression in either blocks the merge. This is what "eval-first" looks like in production — the tests you already wrote, wired to the branch protection.`},{kind:`code`,title:`.github/workflows/ci.yml — the gates`,code:`jobs:
  quality:
    steps:
      - run: make test              # unit + integration
      - run: make eval              # RAGAS: fails if faithfulness < 0.85
  safety:
    steps:
      - run: make redteam           # fails if any gated tool fires unapproved
# branch protection: both jobs must pass to merge. No green, no ship.`},{kind:`list`,items:[`**Full evals nightly, a smoke subset per PR** — LLM-as-judge eval costs real money and time, so don’t run all 50 questions on every commit.`,`**Pin the judge in CI** (model + prompt + temperature 0) so scores are comparable across runs, exactly as in Phase 3.`,`**Cache judge calls** keyed on input so unchanged questions don’t re-bill.`]}]},{id:`p6-c3`,title:`Deploy, watch, and roll back`,tag:`production`,teaches:[`p6-o3`,`p6-o4`],blocks:[{kind:`list`,items:[`**Pick a cheap host:** Fly.io, Render, Railway, or a small VM. Container in, URL out. Your MCP server deploys the same way — and now needs its Phase-7 auth (Bearer or OAuth), because it’s on the internet.`,`**Secrets via the platform’s secret manager**, never in the image or the repo. The compose env-var discipline pays off here.`,"**Health checks + rollback:** a `/health` endpoint the platform pings, and keep the previous image so a bad deploy reverts in one click.",`**Observability is not optional in production:** trace every request for cost, latency, and a sampled faithfulness score. You can’t fix what you can’t see — and you can’t compare two weeks you never recorded.`,`**Watch the bill:** the Phase-1 usage meter feeding a dashboard is how you catch a cost runaway before it catches you.`]},{kind:`p`,text:"One decision inside that third bullet is worth more than the rest of this card: **instrument against OpenTelemetry, not against a vendor SDK.** If your spans are OTel spans, the vendor is an environment variable. If they are `langfuse.trace(...)` calls scattered through the agent loop, the vendor is a refactor — and you will not do it."},{kind:`deepdive`,title:`The portable observability stack, layer by layer`,blocks:[{kind:`table`,headers:[`Layer`,`What it is`,`Why it’s the portable choice`],rows:[[`**OpenTelemetry**`,"The CNCF standard for traces, metrics and logs. `opentelemetry-sdk` plus an exporter",`Vendor-neutral by design and already in your non-AI services. One tracing story for the whole system, not a special one for the LLM parts`],[`**OpenInference / GenAI conventions**`,"Agreed *attribute names* for LLM spans: `llm.model_name`, `llm.token_count.prompt`, tool and retrieval spans",`Conventions are what make a trace legible to a tool that has never seen your code. Invent your own attribute names and every dashboard is bespoke`],[`**The backend**`,`Langfuse v4, Phoenix, Braintrust, or your existing APM`,`Interchangeable *because* of the two rows above. Langfuse v4 is OTel-native; Phoenix reads OpenInference directly`],[`**The exporter**`,"OTLP over HTTP to a collector — or `InMemorySpanExporter` in tests",`The same instrumentation runs in CI with no network and no vendor account, which is how the tracing code gets tested at all`]]},{kind:`code`,title:`Instrument once, choose the vendor later`,code:`tracer = trace.get_tracer("assistant")

def answer(question: str) -> str:
    with tracer.start_as_current_span("llm.call") as span:
        span.set_attribute("llm.model_name", model)          # convention, not invention
        resp = client.chat.completions.create(...)
        u = resp.usage
        span.set_attribute("llm.token_count.prompt", u.prompt_tokens)
        span.set_attribute("llm.token_count.completion", u.completion_tokens)
        span.set_attribute("cost.usd", cost(model, u))       # the Phase-1 meter, on a span
        return resp.choices[0].message.content

# Where it ships is configuration, not code:
#   OTEL_EXPORTER_OTLP_ENDPOINT=https://cloud.langfuse.com/api/public/otel
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:6006/v1/traces   # local Phoenix
# and in tests: InMemorySpanExporter, so the assertions need no network at all.`},{kind:`callout`,tone:`tip`,title:`A span you can assert on is a span you’ll keep`,text:`Tracing rots faster than anything else in a codebase, because nothing fails when it silently stops recording. An in-memory exporter fixes that: your test asserts the span exists and carries a cost attribute, so deleting the instrumentation breaks the build. Exercise 3 does exactly this.`}]},{kind:`flow`,title:`The path to production`,nodes:[{label:`docker compose up`,sub:`works locally`},{label:`CI green`,sub:`tests + eval + red-team`},{label:`Deploy`,sub:`host + secrets + health`},{label:`Observe`,sub:`cost / latency / quality`},{label:`Roll back if needed`,sub:`previous image ready`}]},{kind:`callout`,tone:`warn`,title:`The MCP server changed trust zones`,text:`On your laptop the MCP server was stdio — no auth needed. The moment you deploy it as an HTTP service, it’s reachable by anyone who finds the URL. Turn on the Phase-7 auth (Bearer for internal, OAuth 2.1 for public) and validate token audience. A deployed server without auth is an open door to your tools.`}]},{id:`p6-c-ladder`,title:`The optimization ladder: cache, route, stream`,tag:`cost & latency`,teaches:[`p6-o5`],blocks:[{kind:`predict`,prompt:`Your deployed assistant averages **1.9s** per response, but P99 is **8.4s** and users are complaining about “sometimes it just hangs.” You swap in a model that is genuinely 40% faster. Predict what each number does. Then decide: is that the change you would have made first?`,answer:`The average drops nicely, to roughly 1.3s, and your dashboard looks great. P99 barely moves — it might land around 7.5s. The tail is not made of slow generations; it is made of cache misses, cold starts, a retry after a 429, a reranker pass over too many candidates, one tool call waiting on a slow upstream. A faster model shrinks one term in a sum that the other terms dominate.`,consolidation:`The general form is worth keeping: **averages describe the common path, and complaints come from the tail.** Users do not experience your mean. This is why the objective says defend a P99 budget, and why the ladder below starts with caching rather than with a model swap — caching removes whole requests from the tail instead of shaving each one, and it is the cheapest, most reversible rung. Take the rungs out of order and you get a system that is faster on the dashboard and still hangs.`},{kind:`p`,text:`Your system works and it is online. It is also slower and more expensive than it needs to be, and you have a finite number of changes you can make before you break it. So the question is not *what* can be optimized — it is **what order**. The ladder below is sorted by risk, cheapest and safest first, and taking the rungs out of order is how teams end up with a fast system that gives worse answers.`},{kind:`table`,headers:[`Rung`,`The lever`,`Typical effect`,`What it costs you`],rows:[[`1`,"**Prompt caching** — stabilize the prefix so repeated context bills at cache rates (`p1-c4`)",`Cuts input cost on repeated prefixes; also cuts latency, since cached tokens aren’t re-processed`,`Nothing. Same model, same prompt, same answer — this is the only rung with no behavioural risk at all`],[`2`,`**Exact-match caching** — same question, same context, return the stored answer`,`Removes the call entirely for the duplicate share of your traffic`,`Staleness. Needs a key that includes the context and a TTL you chose deliberately`],[`3`,`**Semantic caching** — a *similar* question reuses a stored answer above a similarity threshold`,`Extends the hit rate past exact duplicates`,`Real risk: the wrong answer to a nearly-right question. The threshold is a quality decision and belongs in your eval suite`],[`4`,`**Routing** — send easy work to a cheap or local model, keep the frontier model for the hard cases`,`The biggest lever on a mixed workload, because most requests are not hard`,`Quality, unless you measure it. Requires a classifier you trust and a per-tier eval score`],[`5`,`**Streaming** — send tokens as they’re generated`,`Time-to-first-token drops to near nothing; *perceived* latency transforms`,`Nothing in cost, and nothing in quality — but it changes zero about total latency, so don’t report it as a speedup`],[`6`,`**Batching / async** — group the work that nobody is waiting for`,`Throughput on ingestion, summarization, backfills`,`Only applies off the request path. Batching something a user is waiting for makes it worse`]]},{kind:`callout`,tone:`warn`,title:`Rungs 3 and 4 are quality changes wearing a cost-saving costume`,text:`Caching a prefix cannot change an answer. A semantic cache and a router absolutely can. This is exactly why Phase 3 came before this one: run the eval suite after each rung and report cost **and** score together. A 60% cheaper system that scores four points lower is not an optimization, it is an undeclared quality cut — and in an interview, someone will find it.`},{kind:`flow`,title:`Where each rung sits on the request path`,nodes:[{label:`Request`,sub:`user question + context`},{label:`Cache lookup`,sub:`exact, then semantic (threshold)`},{label:`Route`,sub:`classify → local · cheap · frontier`},{label:`Call`,sub:`stable prefix first → prompt cache hits`},{label:`Stream`,sub:`first token out immediately`},{label:`Trace`,sub:`cost, tokens, tier, cache hit, ms`}]},{kind:`deepdive`,title:`Then measure it properly: the tail is the budget, not the mean`,blocks:[{kind:`p`,text:`**The average latency of an LLM app is a number that describes nobody.** Response times are heavily right-skewed: a long retrieval, a cache miss, a reasoning burst, a retry after a schema violation. The mean hides all of it behind the fast majority. Your users experience the tail, so the tail is the budget — set a **P99** (or at least P95), alert on it, and treat the mean as a curiosity.`},{kind:`code`,title:`The number that goes in the SLO`,code:`# Mean vs tail on the same 100 requests: same system, two very different stories.
mean = sum(latencies) / len(latencies)          # 480 ms  — "feels fast"
p50  = percentile(latencies, 50)                # 300 ms
p95  = percentile(latencies, 95)                # 2,100 ms
p99  = percentile(latencies, 99)                # 8,400 ms — one user in a hundred waits 8s

# A budget is a bar you can fail, plus a rule for what happens when you do.
def safe_to_promote(new_p99_ms: float, prev_p99_ms: float, budget_ms: float) -> bool:
    if new_p99_ms > budget_ms:
        return False                            # over budget: never ship it
    return new_p99_ms <= prev_p99_ms * 1.2      # or a 20% tail regression: block it

# Report the pair, always. "p50 300ms / p99 8.4s" is a system with a problem.
# "480ms average" is the same system with the problem edited out.`},{kind:`callout`,tone:`tip`,title:`You already have the measuring instrument`,text:`Every rung here needs the same evidence: cost and latency per request, sliced by tier and by cache outcome. That is the trace from the previous card and the bench from Phase 1. Build the measurement first — otherwise you are not optimizing, you are guessing with extra steps.`}]}]},{id:`p6-c-serving`,title:`Serving at scale: vLLM, PagedAttention, continuous batching`,tag:`when you outgrow Ollama`,teaches:[`p6-o5`],blocks:[{kind:`p`,text:`Ollama has carried this entire course, and for one user at a time it is excellent. It is also the wrong tool the moment you have **concurrent** users, because it is optimized for your laptop rather than for throughput. When that day comes, the answer in 2026 is **vLLM** — and it is worth understanding *why* it is faster, because that reasoning is a common interview question and the answer is genuinely elegant.`},{kind:`list`,items:[`**PagedAttention** — the KV cache is stored in fixed-size blocks with a lookup table, exactly the way an operating system pages memory. Naive serving pre-allocates a contiguous block for each request's *maximum* possible length, so most of that GPU memory sits reserved and unused. Paging removes the fragmentation, which means far more requests fit on the same card.`,`**Continuous batching** — instead of waiting for every request in a batch to finish, a finished sequence is evicted and a queued one takes its slot on the next step. With mixed response lengths that keeps the GPU busy rather than idling behind the single slowest generation in the batch.`,`**Prefix sharing** — requests that begin with the same system prompt or document share those KV blocks instead of each holding a copy. The same prefix discipline that earns you a prompt-cache hit with a hosted vendor earns you memory back here.`,"**An OpenAI-compatible server** — `vllm serve <model>` speaks the same API your adapter has been calling since Phase 1. Which means, if you built the adapter properly, moving from Ollama to vLLM is a `base_url` change and nothing else."]},{kind:`callout`,tone:`warn`,title:`You almost certainly don’t need this yet`,text:`vLLM needs a real GPU, and the operational surface — weights, drivers, memory tuning, an autoscaling story — is a job, not an afternoon. Self-hosted serving pays off at sustained high volume, or under a hard privacy constraint. Below that, a hosted budget tier is cheaper than your own time. Reach for this when you can point at the volume, not because it sounds impressive.`},{kind:`table`,headers:[`Serving choice`,`Good for`,`Reach for it when`],rows:[[`**Hosted API**`,`Almost everything, especially before you have traffic`,`Default. Stop here unless you can name the constraint that breaks it`],[`**Ollama**`,`Development, single-user tools, privacy-bound desktop work`,`You want zero cost per token and one request at a time — this whole course`],[`**vLLM (or TGI / SGLang)**`,`Many concurrent users on open weights, on your own GPU`,`You have measured sustained concurrency and a bill that justifies a GPU`]]},{kind:`p`,text:`The serving-at-scale rabbit hole — quantized GPU formats (AWQ, GPTQ), tensor parallelism, speculative decoding, autoscaling — sits on the **Electives shelf** rather than in this phase. It is a real specialism and a genuine detour: nothing else in the course depends on it, and no portfolio reviewer will ask for it unless the job description does.`}]}],example:{title:`Field story: the demo that deployed itself`,text:"An engineer put their hardened assistant + MCP server behind one `docker compose up` and a Fly.io deploy, with CI running evals and the red-team suite on every PR. In the interview, instead of describing the system, they shared the repo, the reviewer ran one command, and it came up — assistant, MCP, retrieval, all of it, no keys. The offer conversation started ninety seconds later. Working software beats slides every time."},exercises:[{id:`p6-e1`,title:`Containerize the assistant + MCP`,repo:`phase8-deploy/01-compose`,rung:`faded`,task:`Write multi-stage Dockerfiles and a compose file that brings your Workshop-4 assistant, your Workshop-7 MCP server, Qdrant, and Ollama up together from one command, with zero API keys on the demo path.`,assesses:[`p6-o1`],needs:[`p3-o2`,`p5-o3`],solution:[`depends_on for ordering; env vars for every URL and secret; a local model so the demo needs no keys.`,`Test the reviewer experience: fresh clone, one command, does it come up?`]},{id:`p6-e2`,title:`The CI gate`,repo:`phase8-deploy/02-ci`,rung:`faded`,task:`Add a GitHub Actions workflow that runs unit tests, a RAGAS smoke eval, and the red-team suite. Make both quality and safety required checks for merge.`,assesses:[`p6-o2`],needs:[`p-evals-o5`,`p4-o4`],solution:[`Smoke subset per PR, full evals nightly; pin and cache the judge.`,`Branch protection is the point — an eval regression or a red-team bypass must actually block the merge, not just warn.`]},{id:`p6-e3`,title:`Deploy it and watch it (with OpenTelemetry)`,repo:`phase8-deploy/03-deploy-observe`,rung:`faded`,task:`Deploy the stack to a cheap host with platform secrets, a health check, and the MCP server’s Phase-7 auth turned on. Then instrument it with real OpenTelemetry spans carrying OpenInference attributes — model, token counts, cost, tier — and compute P95, daily spend and the rollback guard from the exported spans rather than from a side-channel of your own.`,assesses:[`p6-o3`,`p6-o4`],needs:[`p1-o2`,`p5-o4`],solution:[`Secrets from the platform manager, never the image. /health for the platform to ping. Keep the previous image for rollback.`,`The deployed MCP server now needs auth — Bearer for internal, OAuth 2.1 if public. Confirm token audience validation.`,`An InMemorySpanExporter makes the whole tracing layer unit-testable with no collector and no vendor account — which is the only reason tracing code ever stays correct. The exporter is the one line that differs between CI and production.`,`Read your metrics off the spans. The moment latency lives in one place and spans in another, they disagree, and you will trust the wrong one.`]},{id:`p6-e4`,title:`Climb the ladder: cache, route, and defend a P99`,repo:`phase8-deploy/04-cost-latency`,rung:`faded`,task:`Take the request path and add the first four rungs in order: an exact cache, a semantic cache with a similarity threshold, and a tier router with a cost ceiling. Then measure — P50, P95, P99 and cost per request, before and after each rung. Report the pair (cost and quality) every time, and make the budget gate fail a run that blows the tail.`,assesses:[`p6-o5`],needs:[`p1-o2`,`p-evals-o5`,`p-memory-o3`],solution:[`The cache key has to include everything that changes the answer — question plus retrieved context plus model plus tier. A key that ignores the context serves yesterday's document to today's question.`,`The semantic threshold is a quality decision, not a tuning constant. Sweep it, look at what gets wrongly reused at each value, and pick with the evidence in front of you — the same method as the judge threshold in Phase 3.`,`Router savings are only real if the cheap tier holds its eval score. Report cost and score together or don't report the saving.`,`P99 out of 100 requests is one request. Do not build an SLO on a single sample — either collect more, or state your confidence honestly.`]},{id:`p6-e5`,title:`Blank editor: containerize and instrument something you did not build`,rung:`independent`,task:"Empty directory. Take a small service you did not write — a sample FastAPI app, an open-source tool, a friend’s side project — and from nothing produce a multi-stage Dockerfile, a compose file bringing it up alongside one dependency, a real health check, and OpenTelemetry spans on its main request path carrying model, token and cost attributes if it calls a model, or duration and outcome if it does not. Then prove the tracing with an in-memory exporter and no collector running. Done means a stranger can `docker compose up` and see spans.",assesses:[`p6-o1`,`p6-o4`],needs:[`p1-o2`],solution:[`You wrote the Dockerfile without a template. Everyone can copy a multi-stage build; being able to produce one means you know which stage installs the toolchain and why the final image should not contain it.`,"The health check reports something real — a dependency reachable, not just the process alive. A `/health` that returns 200 whenever Python is running tells the platform nothing and will happily keep a broken container in rotation.",`No secrets in the image or the compose file, and you can say where they should come from instead. This is the mistake that survives into real jobs, so catching it on someone else’s service is cheap practice.`,`Your span assertions run with an in-memory exporter and no vendor account. Tracing code that can only be verified by looking at a dashboard is tracing code that quietly rots, and this is the single habit from this phase most worth keeping.`,`The attributes are on the spans, not in a parallel log line. The moment your latency numbers live somewhere other than your traces, the two disagree and you will trust the wrong one.`,`It came up on the first try for someone else. Not for you, on your machine, with your Python version — that is the whole meaning of “containerized”, and the unfamiliar service is what stops your own setup from doing the work invisibly.`]}],workshop:{id:`w-deploy`,title:`Workshop · The deployed stack`,subtitle:`See the assistant before you optimize it: OpenTelemetry spans around the loop and every tool, then an answer cache that knows what it must refuse to store.`,repo:`workshops/assistant`,assesses:[`p6-o1`,`p6-o2`,`p6-o3`,`p6-o4`,`p6-o5`],needs:[`p1-o2`,`p-evals-o5`,`p4-o4`],blocks:[{kind:`p`,text:`The assistant works, it is hardened, and it speaks MCP. It is also a black box that costs an amount nobody has measured and takes a length of time nobody has bounded. This workshop closes that gap in the only order that is safe: **see it, then make it cheaper without making it worse.**`},{kind:`flow`,title:`Two modules, and why the second needs the first`,nodes:[{label:`traced_registry`,sub:`every tool wrapped at the seam`},{label:`agent.run span`,sub:`steps · paused for approval`},{label:`Read the tree`,sub:`time_by_tool · gated_tool_calls`},{label:`AnswerCache`,sub:`offer(), not put()`},{label:`Refusals`,sub:`side effects · paused · step cap`}]},{kind:`p`,text:`**Why the tools are wrapped rather than edited.** Tracing is a cross-cutting concern, and cross-cutting concerns rot when they live inside every implementation: somebody adds a tool, forgets the decorator, and six weeks later there is a hole in the trace nobody can explain. Wrapping the registry makes instrumentation a property of the *seam*, so a new tool is traced whether its author thought about it or not.`},{kind:`callout`,tone:`warn`,title:`Caching an agent is not caching RAG`,text:"A RAG answer is a pure function of a question and a corpus. An agent run sends messages and books meetings. Cache “text my boss the summary” and the second request returns instantly — and no message is sent. Nothing errors, nobody is paged, and the user finds out from their boss. That is why the API is `offer()` rather than `put()`: the caller proposes and the policy decides, reading the **trace** to see which gated tools actually fired."},{kind:`code`,title:`The seam you implement`,code:`# before/src/assistant/observe.py
def traced_registry(registry: dict[str, Tool], tracer) -> dict[str, Tool]:
    # TODO: wrap every tool's body in a span — mark ERROR, then RE-RAISE
    # TODO: an observability layer that swallows an exception has turned a
    #       visible failure into a silent wrong answer
    ...

def gated_tool_calls(spans) -> list[str]:
    # TODO: which irreversible tools actually fired. A safety report, and the
    #       input the cache reads before it stores anything.
    ...

# before/src/assistant/cache.py
def is_cacheable(result, gated_tools_fired) -> bool:
    # TODO: refuse a paused run, a side-effecting run, a step-cap run, an empty
    #       answer. Be conservative: a miss costs money you can graph, a wrong
    #       hit costs trust you cannot.
    ...`},{kind:`callout`,tone:`tip`,title:`The observability layer is not just a dashboard feed`,text:"It is the input to a safety decision. `cached_run` asks the trace which gated tools fired before it will store an answer — because you cannot safely cache what you cannot see. That coupling is the reason this workshop does tracing first and caching second."}],deliverables:[{id:`w-deploy-d1`,text:`The whole stack comes up with **one command and zero API keys** — assistant, MCP server, retrieval and a local model`},{id:`w-deploy-d2`,text:`CI runs tests, a smoke eval and the red-team suite as **required checks**, so a quality or safety regression blocks the merge`},{id:`w-deploy-d3`,text:`Deployed to a real host with **platform secrets, a health check and a rollback path**, and the MCP server’s auth turned on`},{id:`w-deploy-d4`,text:`Every tool is traced by **wrapping the registry** — a test proves a newly-added tool is instrumented without its author doing anything`},{id:`w-deploy-d5`,text:"A failing tool is marked **ERROR on its span and still raises**; the root `agent.run` span carries step count and whether it paused"},{id:`w-deploy-d6`,text:"`gated_tool_calls` reports **which irreversible tools actually fired**, and a contained run reports none"},{id:`w-deploy-d7`,text:`The cache **refuses** a paused run, a side-effecting run, a step-cap run and an empty answer — one test per rule`},{id:`w-deploy-d8`,text:`A repeated read-only question doesn’t rerun the agent; a side-effecting one **reruns every time** — both asserted`},{id:`w-deploy-d9`,text:`P99 and cost per request are reported **next to the eval score**, before and after the caching rung`}],stretch:["Ship the spans somewhere real: point `OTEL_EXPORTER_OTLP_ENDPOINT` at a local Phoenix or a Langfuse project and look at the actual tree. Change nothing in observe.py — if you have to, your instrumentation isn’t portable yet.",`Put cost on the spans with the Phase-1 meter, then find the single most expensive request you have ever made and explain, from the trace alone, why it cost that.`,`Add the semantic layer from exercise 4 and sweep the threshold on your own traffic. Report the wrong-reuse count, not just the hit rate.`,`Gate the deploy on the tail: fail CI when P99 across your golden set busts the budget, using the rollback guard from exercise 3.`]},checkpoint:[{id:`p6-q1`,q:"Why is the zero-API-key `docker compose up` worth the effort?",a:`It proves the system actually runs (most repos don’t), demonstrates local-model fluency, and respects a reviewer’s limited time. Friction kills portfolio reviews and demos; removing it is a real edge.`},{id:`p6-q2`,q:`What changes about your MCP server the moment you deploy it remotely?`,a:`It leaves the safe stdio/OS-isolation trust zone and becomes reachable by anyone with the URL. It now needs Phase-7 auth — Bearer for internal, OAuth 2.1 + PKCE for public — with token-audience validation. A deployed server without auth is an open door.`},{id:`p6-q3`,q:`What belongs in the CI gate for a GenAI app, beyond normal tests?`,a:`The eval suite (RAGAS quality gate) and the red-team suite (safety gate), both as required checks. A merge that regresses faithfulness or lets a landed injection fire a gated tool should be blocked, not merged with a warning.`},{id:`p6-q4`,q:`Your bill is too high. Why start with caching rather than with routing, when routing saves more?`,a:`Because caching cannot change an answer and routing can. Rungs are ordered by risk, not by size: prompt caching and exact-match caching are behaviour-preserving, so they are free wins you can ship without re-running the eval suite. A semantic cache and a router are quality changes — they need a threshold or a classifier you have measured, and they need cost reported alongside the eval score. Take the safe savings first; you may not need the risky ones.`},{id:`p6-q5`,q:`You report “average latency 480ms” and the interviewer pushes back. Why?`,a:`Because LLM latency is heavily right-skewed and the mean describes nobody. Retrieval misses, cache misses, reasoning bursts and schema retries all live in the tail, and the fast majority hides them. That system might be p50 300ms and p99 8.4s — one user in a hundred waiting eight seconds. Quote the pair, budget on P99 (or at least P95), and alert on the tail. Also say your sample size: a P99 from 100 requests is a single data point.`},{id:`p6-q6`,q:`Why instrument with OpenTelemetry rather than your observability vendor’s SDK?`,a:`Portability, and it is cheap to get right up front. Every LLM observability product speaks OTel or exports to it, so OTel spans plus the OpenInference attribute conventions make the backend an environment variable — Langfuse today, Phoenix or your existing APM tomorrow. Vendor SDK calls scattered through the agent loop make it a refactor you will never schedule. Bonus: an in-memory exporter makes the instrumentation unit-testable, so it cannot silently rot.`}],resources:[{label:`Fly.io docs`,url:`https://fly.io/docs`},{label:`Render docs`,url:`https://render.com/docs`},{label:`GitHub Actions — required status checks`,url:`https://docs.github.com/en/actions`},{label:`Docker — multi-stage builds`,url:`https://docs.docker.com/build/building/multi-stage/`},{label:`Langfuse — tracing + cost per query`,url:`https://langfuse.com`},{label:`Ollama Docker image`,url:`https://hub.docker.com/r/ollama/ollama`},{label:`OpenTelemetry Python — tracing SDK`,url:`https://opentelemetry.io/docs/languages/python/`},{label:`OpenInference — semantic conventions for LLM spans`,url:`https://github.com/Arize-ai/openinference`},{label:`Arize Phoenix — OSS, reads OpenInference`,url:`https://arize.com/docs/phoenix`},{label:`vLLM docs — PagedAttention & continuous batching`,url:`https://docs.vllm.ai`},{label:`Anthropic — prompt caching (rung 1 of the ladder)`,url:`https://platform.claude.com/docs/en/build-with-claude/prompt-caching`}]},{id:`p7`,weeks:`Week 18 · ongoing`,color:`#B45309`,title:`The GenAI Mindset`,tagline:`The field moves weekly and interviews test more than knowledge. This phase is about how to keep learning, how to practice, and how to turn everything you built into offers.`,tldr:`A learning system for a field whose skills churn ~66% faster than average: the question bank rehearsed out loud until answers are reflexes, resume bullets carrying numbers mined from your own workshops, and the job search instrumented as a funnel you can fix one stage at a time.`,objectives:[{id:`p7-o1`,text:`**Design** a durable learning system for a field where skills churn ~66% faster than average`},{id:`p7-o2`,text:`**Rehearse** the interview question bank out loud until the answers are reflexes`},{id:`p7-o3`,text:`**Rewrite** your resume so every bullet carries a verifiable number, mined from your own workshops`},{id:`p7-o4`,text:`**Diagnose** your job search as a funnel and fix the one stage that is actually leaking`}],recall:[{id:`p7-r1`,q:`An interviewer asks how you would cut the cost of a live GenAI feature. Give the levers in order, and say why the order is not negotiable.`,a:`Cache, then route, then stream. Caching removes whole requests and is the most reversible change; routing sends easy work to a cheaper tier and must be reported alongside its eval score, or you have bought savings with quality; streaming changes perceived latency rather than cost. Out of order you get a system that is cheaper on the dashboard and worse for users — and “I would use a smaller model” as a first answer is the response that ends the topic early.`,from:`p6-o5`},{id:`p7-r2`,q:`How would you convince a skeptical stakeholder that a change you shipped actually improved the system? No notes.`,a:`A committed baseline and a sliced golden set, with the judge calibrated against your own labels so the number means something, and a gate that would have blocked the change if it regressed. The receipts, not the vibes. This is also, word for word, the most valuable thing you can put on a resume — which is what the next hour is about.`,from:`p-evals-o5`},{id:`p7-r3`,q:`Why does MCP exist, in one sentence, and what does it replace?`,a:`It turns an N×M integration problem into N+M: instead of every agent hand-rolling a client for every system, each system exposes one server and each agent speaks one protocol. It replaces bespoke per-agent tool code, not the tool-calling concept itself. Being able to say this cleanly in fifteen seconds is a small thing that signals a large one.`,from:`p5-o1`}],concepts:[{id:`p7-c1`,title:`The mindset: verify, build, repeat`,tag:`how to keep up`,teaches:[`p7-o1`],blocks:[{kind:`p`,text:`The single most important habit this course tried to build isn’t a framework — it’s a **stance**: verify everything, benchmark on your own data, and trust the shape of a system over the name of a model. Model names in these pages will be stale within months; the patterns — provider-agnostic clients, hybrid + rerank, eval-first, containment, MCP — are the durable bets. That stance is also the honest answer to "how do you keep up?"`},{kind:`list`,items:[`**Follow changelogs, not hype.** Vendor release notes, the MCP spec repo, a couple of rigorous newsletters. Skim weekly; go deep only when something touches your work.`,"**Keep a personal eval set.** A growing `golden.jsonl` on a problem you care about turns every new model into a ten-minute experiment instead of a vibes debate.",`**Build in public.** A repo, a short write-up, a demo. It compounds — and it’s the strongest possible answer to "keep up" because you’re showing a system, not claiming heroics.`,`**Skills churn ~66% faster in AI-exposed roles (PwC).** The premium is partly hazard pay for constant re-learning — which is exactly why the daily-reps habit below never retires.`]},{kind:`callout`,tone:`tip`,title:`The through-line`,text:`Everything you shipped — the RAG service, the assistant, the hardened agent, your own MCP, the deployment — is one connected system, and each piece was measured. That’s the portfolio *and* the mindset. You don’t have five demos; you have one system you can reason about end to end. That’s what senior looks like.`}]},{id:`p7-c2`,title:`Your job search is a funnel — instrument it`,tag:`debug yourself`,teaches:[`p7-o4`],blocks:[{kind:`predict`,prompt:`Two hundred applications in, you have had four interviews and no offers. A friend tells you to rewrite your resume. Before reading on: is that the right fix, and what is the one thing you would need to know before spending a weekend on it?`,answer:`You cannot tell, and the missing number is **how many of the 200 became screens**. If 40 did, your resume is working and the leak is downstream — the screen, the technical, the story. If 3 did, the resume or the targeting is the problem and your friend is right by accident. Same top-line numbers, opposite fixes, and one of them is a wasted weekend.`,consolidation:`You already know this move: it is the stage-by-stage retrieval triage from Phase 2, pointed at yourself. “Two hundred applications, four interviews” is the aggregate score that hides which stage failed, exactly like a single accuracy number over a corpus. The advice you get about job searching is almost always someone else’s bottleneck generalised into a rule — and the same instinct that stops you tuning chunk size before checking whether the document is indexed at all is the one that stops you rewriting a resume that was never the problem.`},{kind:`p`,text:`You spent this whole course learning to debug pipelines by finding the failing stage. Your search is the same shape. Track four numbers and fix only the stage that leaks — rejection is a metric, not a verdict.`},{kind:`flow`,title:`Find the failing stage`,nodes:[{label:`Applications → screens`,sub:`leaking? fix resume + targeting`},{label:`Screens → technicals`,sub:`leaking? fix the story + basics`},{label:`Technicals → onsites`,sub:`leaking? drill the qbank + mocks`},{label:`Onsites → offers`,sub:`leaking? design round + behaviorals`}]},{kind:`p`,text:`One stage at a time, one fix at a time, re-measure. The eval-first habit, pointed at yourself.`}]},{id:`p7-c3`,title:`Resume math: every claim needs a number`,teaches:[`p7-o3`],blocks:[{kind:`table`,headers:[`Noise`,`Signal (mined from your workshops)`],rows:[[`Built a RAG chatbot`,`RAG service: faithfulness 0.92, p95 480ms on a 50-Q golden set, eval-gated CI (Workshop 2)`],[`Worked with AI agents`,`Personal-assistant agent with HITL + least-privilege tools; 3-tier routing cut cost 52% (Workshops 4 & 6)`],[`Familiar with MCP`,`Authored an MCP server (3 tools, OAuth 2.1) consumed by my own agent via discovery (Workshop 7)`],[`Deployed to production`,`One-command stack (assistant + MCP + retrieval), CI-gated on evals + red-team, observable (Phase 8)`]]},{kind:`p`,text:`Every number on the right already exists in your workshop READMEs — mining them is an afternoon. Headline that matches reality: **"GenAI Engineer · RAG · Agents · MCP · evals/LLMOps · security."**`}]},{id:`p7-c4`,title:`The drill system`,teaches:[`p7-o2`],blocks:[{kind:`list`,items:[`**Daily (20 min):** 5 questions from the bank below, out loud, zero notes, self-graded against the reveal. Fumble one twice → spaced-repetition list.`,`**Twice weekly (45 min):** a full Phase-6 design mock, recorded. Score against the 8 steps — anything you didn’t say out loud doesn’t count.`,`**Weekly (15 min):** update the funnel numbers, pick ONE leaking stage, apply one fix.`,`**Out loud matters:** recognizing an answer and producing one under pressure are different skills, and interviews only test the second.`]}]},{id:`p7-c5`,title:`Money talk, with sources`,tag:`fact-checked`,teaches:[`p7-o3`],blocks:[{kind:`list`,items:[`**The "56% AI wage premium" is real** — PwC’s Global AI Jobs Barometer (~1B job ads): AI-skilled workers average a 56% premium, up from 25% the prior year. Economy-wide context, not a personal promise.`,`**India:** GenAI/LLM specialists ₹20–70 LPA mid-senior; strong-portfolio freshers ₹8–22; senior at product companies/GCCs up to ₹70 LPA–1 Cr+.`,`**US:** base clusters ~$110–185K for typical/remote roles (ZipRecruiter, Glassdoor). Total comp at elite labs is another universe — Levels.fyi medians ~$555K at OpenAI, ~$665K at Anthropic.`,`**Present numbers precisely and cite them** — doing so signals the same verify-everything skill as pinning a judge model, and interviewers notice.`]}]}],example:{title:`Field story: the funnel fix`,text:`An engineer with strong workshops sent 90 applications and got 4 screens — then nearly rebuilt his portfolio in frustration. His funnel said otherwise: the projects were never seen because his resume led with responsibilities instead of numbers. One metric-first rewrite later, the same profile pulled a 22% screen rate. He’d been fixing the generate stage when the failure was in retrieval. Debug the stage that’s actually failing — in your pipelines and in your search.`},exercises:[{id:`p7-e1`,title:`Daily reps`,repo:`phase9-mindset/drill-deck`,rung:`faded`,task:`Five questions from the bank, out loud, no notes, self-graded. Every day. The bank doubles as your drill deck.`,assesses:[`p7-o2`],solution:[`Consistency beats intensity: 20 minutes daily outperforms a 3-hour Sunday cram — retrieval practice is how reflexes form.`]},{id:`p7-e2`,title:`The metric-mining pass`,repo:`phase9-mindset/resume`,rung:`faded`,task:`Extract every number from your four workshop READMEs into resume bullets. Delete any bullet that survives without a number.`,assesses:[`p7-o3`],solution:[`Faithfulness, recall, p95, cost-cut %, red-team pass rate, tools shipped — you generated them all; this is an afternoon of copy-editing.`]},{id:`p7-e3`,title:`Instrument the funnel`,repo:`phase9-mindset/funnel-tracker`,rung:`faded`,task:`Set up the 4-stage tracker. After 20 applications, name your leaking stage and apply exactly one fix.`,assesses:[`p7-o4`],solution:[`Screens <10%? Resume/targeting. Technicals failing? Drill deck. Onsites failing? Mock the design round. One variable at a time — like any eval.`]},{id:`p7-e4`,title:`Blank editor: write your own next twelve weeks`,rung:`independent`,task:`Blank page, no template, no example to imitate. Write the learning system you will actually run after this course ends: the sources you will read weekly and why those, the standing weekly slot where you build something small, how a claim gets verified before you repeat it, and the specific trigger that tells you a habit has lapsed. Then, on the same page, write your funnel’s four numbers as they stand today — even if three of them are zero — and name the one stage you will work on next and the one fix you will apply. One page. Date it, and put a review date on it.`,assesses:[`p7-o1`,`p7-o4`],solution:[`It names sources and says why those. “Follow AI Twitter” is not a system; a short list you chose, with a reason attached to each, is one you can prune when a source starts costing more attention than it returns.`,`There is a recurring build slot with a time on it, not an intention to build things. The stance this whole course argued for — verify, build, repeat — collapses into passive reading the moment the build step has no place in the week.`,`You wrote down how a claim gets checked. This is the actual content of the mindset: a benchmark on your own data, a small script, an eval row — something that turns “I read that X is faster” into “I measured X on my corpus.”`,`There is a named lapse trigger. Every learning plan fails eventually; the ones that recover are the ones that told you in advance what failure would look like — two weeks with no build, a month without opening the drill deck.`,`Your four funnel numbers are written down even where they are embarrassing or empty. A funnel you have not instrumented cannot tell you which stage leaks, and the whole argument of this phase is that you would otherwise fix the stage someone else told you about.`,`It fits on one page and has a review date. A plan you will not reread is a document, not a system — and unlike every other task in this course, nobody is going to check this one but you.`]}],workshop:{id:`w-interview`,title:`Workshop · The interview loop`,subtitle:`The only workshop with no code, because the artifact is a habit: a scored design mock, a metrics sheet that traces every claim to a file, and a funnel with a fix attached.`,repo:`workshops/interview-loop`,assesses:[`p7-o1`,`p7-o2`,`p7-o3`,`p7-o4`],needs:[`p4-o1`,`p4-o2`,`p6-o5`],blocks:[{kind:`p`,text:`Eight workshops in, you have a system: a bench, a retrieval service, an eval suite, an agent with memory and guardrails, an MCP server, and a deployment with traces and a cost ladder. You can also, right now, probably not explain it out loud for forty minutes without losing the thread. **That gap is the entire workshop.**`},{kind:`p`,text:`It ships no code on purpose. Every deliverable is a **habit with an artifact attached**, because a habit with no artifact is a resolution, and resolutions do not survive week three. The course has been your forcing function for eighteen weeks and it stops now — what replaces it is the only part of this that still matters after the offer lands.`},{kind:`flow`,title:`One loop, three cadences`,nodes:[{label:`Daily · 20 min`,sub:`5 qbank questions · out loud · no notes`},{label:`2×/week · 45 min`,sub:`recorded mock → score the rubric`},{label:`Weekly · 15 min`,sub:`funnel → name the leaking stage`},{label:`One fix`,sub:`one variable, like any eval`},{label:`Re-measure`,sub:`did the number move?`}]},{kind:`callout`,tone:`warn`,title:`If it isn’t on the recording, it scores zero`,text:`That is the rubric’s only rule and it is the reason mocks get recorded at all. “I know that” and “I would have said it with more time” are not answers an interviewer heard. Expect your first score to be bad — a first mock that scores well almost always means you scored it generously. The **trend across three mocks** is the deliverable,
